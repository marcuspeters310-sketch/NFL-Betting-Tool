<header class="top"><div class="wrap">
  <div class="brand"><h1>NFL <span>Board</span></h1><span class="stamp" id="stamp"></span></div>
  <div class="seg" role="group" aria-label="View">
    <button id="tab-week" type="button" data-view="week">This week</button>
    <button id="tab-teams" type="button" data-view="teams">Teams</button>
  </div>
</div></header>

<main class="wrap" id="app"></main>

<script type="application/json" id="board-data">__BOARD_DATA__</script>
<script>
(() => {
const D = JSON.parse(document.getElementById("board-data").textContent);
const NAMES = {ARI:"Cardinals",ATL:"Falcons",BAL:"Ravens",BUF:"Bills",CAR:"Panthers",CHI:"Bears",CIN:"Bengals",CLE:"Browns",DAL:"Cowboys",DEN:"Broncos",DET:"Lions",GB:"Packers",HOU:"Texans",IND:"Colts",JAX:"Jaguars",KC:"Chiefs",LA:"Rams",LAC:"Chargers",LV:"Raiders",MIA:"Dolphins",MIN:"Vikings",NE:"Patriots",NO:"Saints",NYG:"Giants",NYJ:"Jets",PHI:"Eagles",PIT:"Steelers",SEA:"Seahawks",SF:"49ers",TB:"Buccaneers",TEN:"Titans",WAS:"Commanders"};
const EDGE_GAP = 12;
const OFF = D.metric_defs.offense, DEF = D.metric_defs.defense;
const app = document.getElementById("app");

const store = {
  get(k, d){ try { const v = localStorage.getItem("nflboard." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem("nflboard." + k, JSON.stringify(v)); } catch {} }
};
const state = {
  view: store.get("view", "week"),
  week: store.get("week", D.current_week),
  team: store.get("team", "BUF"),
  open: new Set(),
  tabs: {},
  modelOpen: false,
  tileView: {},
  tileExpanded: new Set(),
  gameTeam: null,
  depthSel: null,
};
const isResultsWeek = w => (D.results_weeks || []).some(x => x.week === w);
const allWeekNums = () => [...D.weeks.map(w => w.week), ...(D.results_weeks || []).map(w => w.week)];
if (!allWeekNums().includes(state.week)) state.week = D.current_week;
if (!D.teams[state.team]) state.team = Object.keys(D.teams)[0];

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = (iso, wd) => { const [y,m,d] = iso.split("-").map(Number); return `${wd}, ${MONTHS[m-1]} ${d}`; };
const fmtKick = t => { if (!t) return ""; let [h,m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; };
const minus = "−";
function spreadText(g){
  if (g.spread == null) return "No line";
  if (g.spread > 0) return `${g.home} ${minus}${g.spread}`;
  if (g.spread < 0) return `${g.away} ${minus}${-g.spread}`;
  return "Pick'em";
}
function rk(r){
  if (r == null) return `<span class="rk">–</span>`;
  const c = r <= 5 ? "g1" : r <= 10 ? "g2" : r >= 28 ? "b1" : r >= 23 ? "b2" : "";
  return `<span class="rk ${c}">#${r}</span>`;
}
function recText(r){
  if (!r || !r.n) return `<span class="num">no games</span>`;
  return `<span class="num">${esc(r.record)} · ${r.pct}% · n=${r.n} · ±${r.moe}</span>${r.sig ? '<span class="sig">signal</span>' : ""}`;
}

const tip = document.createElement("div"); tip.id = "tip"; tip.hidden = true; document.body.appendChild(tip);
const pm = (v, d = 1) => v == null ? "–" : `<span class="pm ${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${v > 0 ? "+" : v < 0 ? minus : ""}${Math.abs(v).toFixed(d)}</span>`;
const pct = v => v == null ? "–" : `${Math.round(v)}%`;
const lineFor = (team, line) => line == null ? "–" : line === 0 ? "PK" : `${team} ${line > 0 ? minus : "+"}${Math.abs(line)}`;
const modelSpread = (g, margin) => margin == null ? "–" : Math.abs(margin) < 0.05 ? "PK" : margin > 0 ? `${g.home} ${minus}${margin.toFixed(1)}` : `${g.away} ${minus}${(-margin).toFixed(1)}`;
const SHORT = {"Injured reserve": "IR", "PUP list": "PUP", "Non-football injury list": "NFI", "Reserve list": "RES"};
function pill(x, rs){
  if (x === "active") return "";
  const label = x === "out" ? (SHORT[rs] || "OUT") : x === "doubtful" ? "D" : x === "questionable" ? "Q" : "LP";
  const title = x === "limited" ? "Limited or no practice, no game status" : (rs || x);
  return `<span class="st ${x}" title="${esc(title)}">${label}</span>`;
}

function modelBox(g){
  const m = g.model; if (!m) return "";
  const bt = D.backtest;
  return `<div class="model">
    <div><div class="k">Model line</div><div class="v">${modelSpread(g, m.model_margin)}</div><div class="s">market ${spreadText(g)}</div></div>
    <div><div class="k">Model total</div><div class="v">${m.model_total?.toFixed(1) ?? "–"}</div><div class="s">market ${g.total ?? "–"}</div></div>
    <div><div class="k">Model leans</div><div class="v">${m.side ?? "–"} · ${m.lean ?? "–"}</div><div class="s">gaps ${Math.abs(m.spread_edge ?? 0).toFixed(1)} / ${Math.abs(m.total_edge ?? 0).toFixed(1)} pts</div></div>
  </div>
  ${bt && bt.spreads ? `<p class="meta" style="margin:0">Power ratings: ${g.away} ${pm(m.away_rating)}, ${g.home} ${pm(m.home_rating)} pts vs an average team. In a ${bt.season} backtest the model's side went ${bt.spreads[0].record}, so a gap is a reason to look closer, not a bet.</p>` : ""}`;
}

function depthBoard(av, side){
  const rows = new Map();
  for (const p of av.depth.filter(p => p.s === side)){
    if (!rows.has(p.p)) rows.set(p.p, []);
    rows.get(p.p).push(p);
  }
  return `<div class="depth">${[...rows].map(([pos, ps]) => `<div class="row"><span class="pos">${pos}</span><span class="names">${
    ps.map(p => `<span class="${p.st ? "p1" : "dim"} ${p.x === "out" ? "hurt-out" : ""}">${esc(p.n)}</span>${pill(p.x, p.rs)}`).join("")
  }</span></div>`).join("")}</div>`;
}
function shareBar(v, label){
  if (v == null) return `<div class="share"><span>${label}</span><span class="track"></span><span>–</span></div>`;
  return `<div class="share"><span>${label}</span><span class="track"><b style="width:${Math.round(v*100)}%"></b></span><span class="num">${Math.round(v*100)}%</span></div>`;
}
function hurtCards(av, onlyStarters){
  let list = av.depth.filter(p => p.x !== "active");
  if (onlyStarters) list = list.filter(p => p.st);
  list = list.slice().sort((a, b) => (b.st - a.st) || ((b.sh ?? 0) - (a.sh ?? 0)));
  if (!list.length) return `<p class="meta">Nobody on this depth chart is on the injury report or a reserve list.</p>`;
  // Starters, game-status players and real rotation pieces get a card; deep
  // backups on long-term lists go in a collapsed line so they don't bury them.
  const main = list.filter(p => p.st || p.x !== "out" || (p.sh ?? 0) >= 0.25);
  const deep = list.filter(p => !main.includes(p));
  return `<div class="injlist">${main.map(p => card(p)).join("")}</div>${deep.length ? `<details class="more" style="margin-top:8px"><summary>${deep.length} deeper backups on reserve lists</summary>
    <p class="meta">${deep.map(p => `${esc(p.n)} (${p.p}${p.sh != null ? ", " + Math.round(p.sh*100) + "% snaps" : ""})${pill(p.x, p.rs)}`).join(" · ")}</p></details>` : ""}`;
}
function card(p){
  return `<div class="hcard ${p.x}">
    <div class="htop"><span><span class="who">${esc(p.n)}</span>${pill(p.x, p.rs)}</span><span class="role">${p.p} · ${p.st ? "starter" : "backup #" + p.r}</span></div>
    <div class="det">${esc([p.rs, p.inj].filter(Boolean).join(" · ") || "Limited in practice")}${p.pr ? ` · ${esc(p.pr.replace(" in Practice","").replace("Participation","practice"))}` : ""}</div>
    ${shareBar(p.sh, "Snaps")}${p.sb ? `<div class="role">snap share from ${esc(p.sb)}</div>` : ""}
    ${p.rp ? `<div class="det">Next man up: <b>${esc(p.rp)}</b></div>${shareBar(p.rsh, "His snaps")}` : ""}
  </div>`;
}
function hurtLastGameBlock(av){
  if (av.current || !av.hurt_last_game?.length) return "";
  const rows = av.hurt_last_game.map(p => `<div class="hlg-row ${p.returned ? "back" : "out"}">
      <span class="who">${esc(p.name)}</span><span class="role">${esc(p.pos)}</span>
      <span class="hlg-tag">${p.returned ? "Returned to that game" : "Did not return"}</span>
    </div>`).join("");
  return `<div class="notice hlg">
    <b>Hurt last game</b> (vs ${esc(av.hurt_last_game[0].opp)}) -- this week's official injury report isn't out yet, so this is from the play-by-play, not a diagnosis.
    <div class="hlg-list">${rows}</div>
  </div>`;
}
function availabilityPanel(t){
  const av = currentWeek().avail?.[t] || D.teams[t]?.avail;
  if (!av) return `<p class="meta">No depth chart loaded for ${t}.</p>`;
  const note = av.report_week == null ? "No injury report has been filed yet this season."
    : av.current ? `Week ${av.report_week} injury report.`
    : `The week ${av.week} injury report isn't out yet (teams file Wednesday to Friday). Showing week ${av.report_week}, so statuses may have changed.`;
  const extra = (av.reserve.length ? `<details class="more"><summary>${av.reserve.length} more on reserve lists (not on the depth chart)</summary>
      <div class="tbl-wrap"><table><thead><tr><th>Player</th><th>Pos</th><th>List</th><th class="r">Snaps</th></tr></thead><tbody>
      ${av.reserve.map(r => `<tr><td>${esc(r.player_name)}</td><td>${esc(r.position)}</td><td>${esc(r.list)}</td><td class="r num">${r.snap_share == null ? "–" : Math.round(r.snap_share*100) + "%"}</td></tr>`).join("")}
      </tbody></table></div></details>` : "")
    + (av.other.length ? `<details class="more"><summary>${av.other.length} more on the injury report</summary>
      <div class="tbl-wrap"><table><thead><tr><th>Player</th><th>Pos</th><th>Status</th><th>Injury</th><th class="r">Snaps</th></tr></thead><tbody>
      ${av.other.map(r => `<tr><td>${esc(r.player_name)}</td><td>${esc(r.position)}</td><td>${esc(r.report_status || "Limited practice")}</td><td>${esc(r.injury || "")}</td><td class="r num">${r.snap_share == null ? "–" : Math.round(r.snap_share*100) + "%"}</td></tr>`).join("")}
      </tbody></table></div></details>` : "");
  return `<div class="block"><h4>${t} ${NAMES[t] || ""}</h4>
    <p class="notice">${esc(note)} Depth chart as of ${esc(av.snapshot)}.</p>
    ${hurtLastGameBlock(av)}
    <h3 class="sec-h" style="margin-top:10px">Not fully available</h3>${hurtCards(av, false)}
    ${extra}
    <div class="pair" style="margin-top:12px"><div><h3 class="sec-h">Offense</h3>${depthBoard(av, "O")}</div><div><h3 class="sec-h">Defense</h3>${depthBoard(av, "D")}</div></div>
  </div>`;
}

function anglesTable(angles, mode){
  const ou = mode === "ou";
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Window</th>${ou
      ? `<th class="r">O-U</th><th class="r">Over %</th><th class="r">±</th><th class="r">Pts vs total</th>`
      : `<th class="r">ATS</th><th class="r">Cover %</th><th class="r">±</th><th class="r">Avg</th><th class="r">Median</th>`}<th></th></tr></thead>
    <tbody>${angles.map(a => `<tr class="${a.this_game ? "here" : ""}"><td>${esc(a.angle)}</td>${ou
      ? `<td class="r num">${esc(a.ou_record)}</td><td class="r num">${pct(a.over_pct)}</td><td class="r num">${a.ou_moe == null ? "–" : "±" + Math.round(a.ou_moe)}</td><td class="r">${pm(a.avg_total_vs_line)}</td><td>${a.ou_sig ? '<span class="sig">signal</span>' : ""}</td>`
      : `<td class="r num">${esc(a.record)}</td><td class="r num">${pct(a.pct)}</td><td class="r num">${a.moe == null ? "–" : "±" + Math.round(a.moe)}</td><td class="r">${pm(a.avg_margin)}</td><td class="r">${pm(a.median_margin)}</td><td>${a.sig ? '<span class="sig">signal</span>' : ""}</td>`
    }</tr>`).join("")}</tbody></table></div>`;
}

function recentChart(recent, team){
  if (!recent.length) return `<p class="meta">No recent games with a line.</p>`;
  const W = 360, H = 170, padL = 30, padB = 30, padT = 14;
  const maxAbs = Math.max(7, ...recent.map(r => Math.abs(r.m ?? 0)));
  const top = Math.ceil(maxAbs / 7) * 7;
  const plotH = H - padB - padT, zeroY = padT + plotH / 2;
  const y = v => zeroY - (v / top) * (plotH / 2);
  const band = (W - padL) / recent.length, bw = Math.min(18, band - 6);
  let extreme = 0; recent.forEach((r, i) => { if (Math.abs(r.m) > Math.abs(recent[extreme].m)) extreme = i; });
  const bars = recent.map((r, i) => {
    const cx = padL + band * i + band / 2, v = r.m ?? 0;
    const h = Math.max(Math.abs(y(v) - zeroY), v === 0 ? 2 : 1);
    const cls = r.ats === "W" ? "cover" : r.ats === "L" ? "miss" : "push";
    const x0 = cx - bw / 2, rad = Math.min(4, h, bw / 2);
    // Rounded at the data end, square at the zero line.
    const d = v >= 0
      ? `M${x0},${zeroY} V${zeroY - h + rad} Q${x0},${zeroY - h} ${x0 + rad},${zeroY - h} H${x0 + bw - rad} Q${x0 + bw},${zeroY - h} ${x0 + bw},${zeroY - h + rad} V${zeroY} Z`
      : `M${x0},${zeroY} V${zeroY + h - rad} Q${x0},${zeroY + h} ${x0 + rad},${zeroY + h} H${x0 + bw - rad} Q${x0 + bw},${zeroY + h} ${x0 + bw},${zeroY + h - rad} V${zeroY} Z`;
    const tipText = `${r.d}${r.post ? " (playoffs)" : ""}<br>${r.home ? "vs" : "@"} ${r.opp} · ${team} ${r.pf}–${r.pa}<br>Line ${lineFor(team, r.line)} · ${r.ats === "W" ? "covered by" : r.ats === "L" ? "missed by" : "push"} ${r.ats === "P" ? "" : Math.abs(r.m).toFixed(1)}<br>Total: ${r.ou ? r.ou.toLowerCase() : "–"}`;
    const lbl = (i === extreme || i === recent.length - 1)
      ? `<text class="val" x="${cx}" y="${v >= 0 ? zeroY - h - 4 : zeroY + h + 11}" text-anchor="middle">${v > 0 ? "+" : v < 0 ? minus : ""}${Math.abs(v).toFixed(1)}</text>` : "";
    return `<path class="${cls}" d="${d}" style="fill:var(--${cls === "push" ? "muted" : cls})"></path>${lbl}
      <text x="${cx}" y="${H - padB + 13}" text-anchor="middle">${r.home ? "" : "@"}${r.opp}</text>
      <text x="${cx}" y="${H - padB + 25}" text-anchor="middle">${r.d.slice(5).replace("-", "/")}</text>
      <rect class="hit" x="${padL + band * i}" y="${padT}" width="${band}" height="${plotH}" data-tip="${esc(tipText)}"></rect>`;
  }).join("");
  return `<div class="chart">
    <div class="legend"><span><i style="background:var(--cover)"></i>Covered</span><span><i style="background:var(--miss)"></i>Missed</span><span>Bar height = points beat or missed the spread by</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${team} last ${recent.length} games against the spread">
      <line class="grid" x1="${padL}" x2="${W}" y1="${y(top)}" y2="${y(top)}"></line>
      <line class="grid" x1="${padL}" x2="${W}" y1="${y(-top)}" y2="${y(-top)}"></line>
      <line class="zero" x1="${padL}" x2="${W}" y1="${zeroY}" y2="${zeroY}"></line>
      <text x="${padL - 5}" y="${y(top) + 4}" text-anchor="end">+${top}</text>
      <text x="${padL - 5}" y="${zeroY + 4}" text-anchor="end">0</text>
      <text x="${padL - 5}" y="${y(-top) + 4}" text-anchor="end">${minus}${top}</text>
      ${bars}
    </svg></div>`;
}

function luckBlock(l, label){
  if (!l) return `<p class="meta">${label}: no games yet.</p>`;
  return `<div class="luck"><div><b>${label}</b>: ${esc(l.record)} · points say ${l.pythag?.toFixed(1)} wins (${pm(l.luck)}) · one-score ${esc(l.close)} · turnover margin ${pm(l.to, 2)}/g · fumble recovery ${l.fum == null ? "–" : Math.round(l.fum*100) + "%"}</div>
    ${l.flags.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px">${l.flags.map(([k, t]) => `<span class="flag ${k}">${k === "lucky" ? "Regression risk" : "Better than the record"}: ${esc(t)}</span>`).join("")}</div>`
      : (l.games >= 4 ? `<div class="meta">No luck flags.</div>` : `<div class="meta">Too early for flags (needs 4+ games).</div>`)}
  </div>`;
}

function totalsPanel(g, W){
  const M = W.metrics;
  const rows = D.pace_defs.map(([k, label]) => [k, label, false])
    .concat([["off_ppg", "Points / game", false], ["def_ppg", "Points allowed / game", false], ["off_explosive", "Explosive play rate", false], ["def_explosive", "Explosive plays allowed", false]]);
  const neutralRk = r => r == null ? `<span class="rk">–</span>` : `<span class="rk">#${r}</span>`;
  const m = g.model;
  return `<div class="panel">
    ${m ? `<div class="model"><div><div class="k">Model total</div><div class="v">${m.model_total?.toFixed(1)}</div><div class="s">market ${g.total ?? "–"} · gap ${pm(m.total_edge)}</div></div>
      <div><div class="k">Model leans</div><div class="v">${m.lean ?? "–"}</div><div class="s">${D.backtest?.totals ? `backtest ${D.backtest.totals[0].record} overall` : ""}</div></div></div>` : ""}
    <div class="block"><h4>Pace and style</h4><div class="tbl-wrap"><table>
      <thead><tr><th>Stat</th><th class="r">${g.away}</th><th class="r">Rk</th><th class="r">${g.home}</th><th class="r">Rk</th></tr></thead>
      <tbody>${rows.map(([k, label]) => {
        const a = M[g.away]?.v?.[k] || [null, null], h = M[g.home]?.v?.[k] || [null, null];
        const isPace = D.pace_defs.some(p => p[0] === k);
        return `<tr><td>${esc(label)}</td><td class="r num">${esc(a[0] ?? "–")}</td><td class="r">${isPace ? neutralRk(a[1]) : rk(a[1])}</td><td class="r num">${esc(h[0] ?? "–")}</td><td class="r">${isPace ? neutralRk(h[1]) : rk(h[1])}</td></tr>`;
      }).join("")}</tbody></table></div>
      <p class="note">Pace ranks are neutral: #1 is the fastest, most plays, or most pass-heavy. Two fast, pass-heavy teams mean more possessions, and more possessions mean more points.</p></div>
    <div class="pair">
      <div class="block"><h4>${g.away} over / under</h4>${anglesTable(g.trends.away.angles, "ou")}</div>
      <div class="block"><h4>${g.home} over / under</h4>${anglesTable(g.trends.home.angles, "ou")}</div>
    </div>
  </div>`;
}

/* offense-vs-defense rows for one direction */
function matchup(metrics, off, def){
  const o = metrics[off]?.v || {}, d = metrics[def]?.v || {};
  return OFF.map(([ok, label], i) => {
    const dk = DEF[i][0];
    const [ov, or] = o[ok] || [null, null];
    const [dv, dr] = d[dk] || [null, null];
    let edge = null;
    if (or != null && dr != null){
      if (dr - or >= EDGE_GAP) edge = "o";
      else if (or - dr >= EDGE_GAP) edge = "d";
    }
    return {label, ov, or, dv, dr, edge, gap: (or != null && dr != null) ? dr - or : null};
  });
}
function edgeCounts(metrics, g){
  const a = matchup(metrics, g.away, g.home), h = matchup(metrics, g.home, g.away);
  return {
    awayO: a.filter(r => r.edge === "o").length, homeD: a.filter(r => r.edge === "d").length,
    homeO: h.filter(r => r.edge === "o").length, awayD: h.filter(r => r.edge === "d").length,
  };
}
function matchupTable(metrics, off, def){
  const rows = matchup(metrics, off, def);
  if (!metrics[off] && !metrics[def]) return `<p class="meta">No team metrics for this game.</p>`;
  return `<div class="block">
    <h4>${off} offense vs ${def} defense</h4>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Stat</th><th class="r">${off} O</th><th class="r">Rk</th><th class="r">${def} D</th><th class="r">Rk</th><th class="r">Edge</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="${r.edge ? "has-edge" : ""}">
        <td class="stat">${esc(r.label.replace(" / play","/play"))}</td>
        <td class="r num">${esc(r.ov ?? "–")}</td><td class="r">${rk(r.or)}</td>
        <td class="r num">${esc(r.dv ?? "–")}</td><td class="r">${rk(r.dr)}</td>
        <td class="r">${r.edge === "o" ? `<span class="edge o">${off} O</span>` : r.edge === "d" ? `<span class="edge d">${def} D</span>` : ""}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="note">${off}: ${esc(metrics[off]?.note ?? "no data")}<br>${def}: ${esc(metrics[def]?.note ?? "no data")}</div>
  </div>`;
}
function splitsTable(t){
  const s = D.teams[t]?.splits || [];
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Split</th><th class="r">ATS</th><th class="r">n</th><th class="r">Win %</th><th class="r">±95%</th><th class="r">Avg</th><th class="r">Median</th><th></th></tr></thead>
    <tbody>${s.map(r => `<tr><td>${esc(r.k)}</td><td class="r num">${esc(r.r)}</td><td class="r num">${r.n}</td>
      <td class="r num">${r.p == null ? "–" : r.p.toFixed(1)}</td><td class="r num">${r.m == null ? "–" : "±" + r.m.toFixed(1)}</td><td class="r">${pm(r.am)}</td><td class="r">${pm(r.md)}</td>
      <td>${r.s ? '<span class="sig">signal</span>' : ""}</td></tr>`).join("")}</tbody>
  </table></div>`;
}
function atsBlock(t, side){
  const T = D.teams[t];
  if (!T) return "";
  const sideRec = side === "home" ? T.ats_home : T.ats_away;
  return `<div class="block"><h4>${t} ${NAMES[t] || ""}</h4><div class="recs">
    <div><span>ATS overall</span>${recText(T.ats)}</div>
    <div><span>ATS as ${side}</span>${recText(sideRec)}</div>
    <div><span>Over / under</span>${T.ou.n ? `<span class="num">${esc(T.ou.record)} · ${T.ou.pct}% over · n=${T.ou.n} · ±${T.ou.moe}</span>${T.ou.sig ? '<span class="sig">signal</span>' : ""}` : '<span class="num">no games</span>'}</div>
  </div></div>`;
}

function gameCard(g, metrics){
  const e = edgeCounts(metrics, g);
  const chips = [];
  if (g.final){
    chips.push(`<span class="chip final">${g.away} ${g.final.away}–${g.final.home} ${g.home}</span>`);
    const cov = g.final.home_ats === "W" ? `${g.home} covered` : g.final.home_ats === "L" ? `${g.away} covered` : g.final.home_ats === "P" ? "ATS push" : null;
    if (cov) chips.push(`<span class="chip mark">${cov}</span>`);
    if (g.final.ou) chips.push(`<span class="chip">${g.final.ou === "OVER" ? "Over" : g.final.ou === "UNDER" ? "Under" : "Total push"}</span>`);
  }
  if (e.awayO) chips.push(`<span class="chip edge-o">${g.away} O edge ×${e.awayO}</span>`);
  if (e.homeO) chips.push(`<span class="chip edge-o">${g.home} O edge ×${e.homeO}</span>`);
  if (e.awayD) chips.push(`<span class="chip edge-d">${g.away} D edge ×${e.awayD}</span>`);
  if (e.homeD) chips.push(`<span class="chip edge-d">${g.home} D edge ×${e.homeD}</span>`);
  if (g.div) chips.push(`<span class="chip">Division</span>`);
  if (g.prime) chips.push(`<span class="chip">Primetime</span>`);
  if (g.roof) chips.push(`<span class="chip">${esc(g.roof === "outdoors" ? "Outdoors" : g.roof === "dome" ? "Dome" : "Roof " + g.roof)}</span>`);

  if (g.model && g.model.spread_edge != null && Math.abs(g.model.spread_edge) >= 3)
    chips.unshift(`<span class="chip gap">Model gap ${Math.abs(g.model.spread_edge).toFixed(1)} · ${g.model.side}</span>`);
  const W = currentWeek();
  const hurtStarters = [g.away, g.home].flatMap(t => (W.avail?.[t]?.depth || []).filter(p => p.st && ["out", "doubtful", "questionable"].includes(p.x)).map(p => t));
  if (hurtStarters.length) chips.push(`<span class="chip edge-d">${hurtStarters.length} starter${hurtStarters.length === 1 ? "" : "s"} hurt</span>`);

  const open = state.open.has(g.id) ? " open" : "";
  return `<details class="game" id="g-${g.id}" data-id="${g.id}"${open}>
    <summary>
      <span class="kick">${fmtKick(g.time)}</span>
      <span><span class="teams-line">${g.away}<span class="at">@</span>${g.home}</span><br><span class="fullnames">${NAMES[g.away] || ""} at ${NAMES[g.home] || ""}</span></span>
      <span class="line"><span class="spread">${spreadText(g)}</span><span class="total">${g.total == null ? "no total" : "o/u " + g.total}</span></span>
      <span class="chips">${chips.join("")}</span>
    </summary>
    <div class="body" data-body="${g.id}">${open ? gameBody(g) : ""}</div>
  </details>`;
}

const TABS = [["matchup", "Matchup"], ["injuries", "Injuries"], ["trends", "ATS & trends"], ["totals", "Totals"]];
function gameBody(g){
  const W = currentWeek(), metrics = W.metrics;
  const tab = state.tabs[g.id] || "matchup";
  const meta = [g.stadium, `Rest: ${g.away} ${g.away_rest ?? "?"}d / ${g.home} ${g.home_rest ?? "?"}d`].filter(Boolean).join(" · ");
  let panel = "";
  if (tab === "matchup"){
    panel = `<div class="panel">
      <div class="pair">${matchupTable(metrics, g.away, g.home)}${matchupTable(metrics, g.home, g.away)}</div>
      <div class="pair">
        <div class="block"><h4>${g.away} luck check</h4>${luckBlock(W.luck?.[g.away], D.season + " so far")}${luckBlock(D.teams[g.away]?.luck_prior, String(D.season - 1))}</div>
        <div class="block"><h4>${g.home} luck check</h4>${luckBlock(W.luck?.[g.home], D.season + " so far")}${luckBlock(D.teams[g.home]?.luck_prior, String(D.season - 1))}</div>
      </div>
      <p class="meta" style="margin:0">Luck check: records built on close wins, turnover luck or fumble bounces tend to fall back toward the team's points-based level. Markets price records. These numbers price performance.</p>
    </div>`;
  } else if (tab === "injuries"){
    panel = `<div class="panel">${availabilityPanel(g.away)}${availabilityPanel(g.home)}</div>`;
  } else if (tab === "trends"){
    panel = `<div class="panel">${["away", "home"].map(side => {
      const t = g[side], T = g.trends[side];
      return `<div class="block"><h4>${t} ${NAMES[t] || ""}</h4>
        ${anglesTable(T.angles, "ats")}
        <p class="note">Avg / Median = points per game they beat (+) or missed (${minus}) the spread. Highlighted rows apply to this game. Last 3/5/10 include playoffs and span seasons.</p>
        <h3 class="sec-h" style="margin-top:12px">Last ${T.recent.length} games vs the spread</h3>${recentChart(T.recent, t)}
      </div>`;
    }).join("")}
    <details class="more"><summary>Full ATS splits for both teams (${D.n_seasons} seasons through ${D.through})</summary>
      <div class="pair"><div class="block"><h4>${g.away}</h4>${splitsTable(g.away)}</div><div class="block"><h4>${g.home}</h4>${splitsTable(g.home)}</div></div>
    </details>
    <div class="pair">${atsBlock(g.away, "away")}${atsBlock(g.home, "home")}</div></div>`;
  } else {
    panel = totalsPanel(g, W);
  }
  return `<div class="meta">${esc(meta)}</div>
    ${modelBox(g)}
    <div class="tabs" role="tablist" aria-label="Game detail">${TABS.map(([k, label]) => `<button type="button" role="tab" id="tab-${g.id}-${k}" data-tab="${k}" data-game="${g.id}" aria-selected="${k === tab}">${label}</button>`).join("")}</div>
    ${panel}`;
}
const currentWeek = () => D.weeks.find(w => w.week === state.week) || D.weeks[0];
const findGame = id => currentWeek().games.find(g => g.id === id);

/* ======================================================================
   This week: one tile per game, with a Spread / Over-Under switch.
   Tap a tile's header to open the full game page (#game=<id>).
   ====================================================================== */
const TEAM_FULL = id => NAMES[id] || id;
const ENTRIES = ["2026 season", "Last 3 games", "Last 5 games", "Last 10 games"];
const WIN_LABEL = {"Last 3 games": "Last 3", "Last 5 games": "Last 5", "Last 10 games": "Last 10"};
const sgn = (v, d = 1) => v == null ? "–" : `${v > 0 ? "+" : v < 0 ? minus : ""}${Math.abs(v).toFixed(d)}`;
const sgnCls = v => v == null || v === 0 ? "" : v > 0 ? "pos" : "neg";
const rkN = r => r == null ? `<span class="rk">–</span>` : `<span class="rk">#${r}</span>`;   // neutral rank (pace)
const mv = (t, k) => currentWeek().metrics?.[t]?.v?.[k] || [null, null];
const fnum = s => s == null ? null : parseFloat(String(s).replace(minus, "-"));

function hurtCount(t){
  const dep = currentWeek().avail?.[t]?.depth || [];
  const hurt = dep.filter(p => p.st && ["out", "doubtful", "questionable"].includes(p.x));
  return {o: hurt.filter(p => p.s === "O").length, d: hurt.filter(p => p.s === "D").length};
}
function windowRows(g, kind){
  const pick = side => {
    const A = new Map((g.trends?.[side]?.angles || []).map(a => [a.angle, a]));
    return ENTRIES.map(k => {
      const key = k === "2026 season" ? `${D.season} season` : k;
      const a = A.get(key);
      if (!a) return null;
      return kind === "ats"
        ? {rec: a.n || a.games ? a.record : "–", m: a.avg_margin, n: a.games}
        : {rec: a.ou_n || a.games ? a.ou_record : "–", m: a.avg_total_vs_line, n: a.games};
    });
  };
  const A = pick("away"), H = pick("home");
  return ENTRIES.map((k, i) => ({label: WIN_LABEL[k] || String(D.season), a: A[i], h: H[i]}));
}
const cellL = ([v, r], rank = rk) => `<span class="c l">${rank(r)}<span class="num">${esc(v ?? "–")}</span></span>`;
const cellR = ([v, r], rank = rk) => `<span class="c r"><span class="num">${esc(v ?? "–")}</span>${rank(r)}</span>`;
const mid = (top, bot) => `<span class="mid"><span>${top}</span>${bot ? `<small>${bot}</small>` : ""}</span>`;
const mrow = (l, m, r) => `<div class="mrow">${l}${m}${r}</div>`;
const hurtSpan = (n, word, right) => `<span class="c ${right ? "r" : "l"} num ${n ? "hurt" : "zero"}">${n} ${word}</span>`;

function weatherStrip(g, compact){
  const w = g.wx || {};
  const F = D.weather_flags || {wind: 15, rain: 50};
  const bits = [];
  if (g.neutral && !w.roof) bits.push(`<span class="wx-i">Neutral site · no forecast</span>`);
  else if (w.roof === "dome") bits.push(`<span class="wx-i">${ICON.roof}Indoors</span>`);
  else {
    if (w.roof === "retractable") bits.push(`<span class="wx-i">${ICON.roof}Retractable roof</span>`);
    if (w.temp == null && w.wind == null) bits.push(`<span class="wx-i muted">${g.final ? "No weather recorded" : "Forecast not available yet"}</span>`);
    else {
      if (w.temp != null) bits.push(`<span class="wx-i">${ICON.temp}${Math.round(w.temp)}°F</span>`);
      if (w.wind != null) bits.push(`<span class="wx-i ${w.wind >= F.wind ? "warn" : ""}">${ICON.wind}${Math.round(w.wind)} mph${w.gust != null && w.gust >= w.wind + 8 ? ` <small>(gusts ${Math.round(w.gust)})</small>` : ""}</span>`);
      if (w.precip != null) bits.push(`<span class="wx-i ${w.precip >= F.rain ? "warn" : ""}">${ICON.rain}${Math.round(w.precip)}% rain</span>`);
    }
  }
  const note = w.flag ? `Weather flag: ${esc(w.flag)}` : w.src === "forecast" ? "Kickoff forecast" : w.src === "recorded" ? "Recorded at kickoff" : "";
  return `<div class="wx ${w.flag ? "flag" : ""} ${compact ? "compact" : ""}">${bits.join("")}${note ? `<span class="wx-note">${note}${g.stadium && !compact ? " · " + esc(g.stadium) : ""}</span>` : ""}</div>`;
}
const ICON = {
  temp: `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>`,
  wind: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h8.5a2 2 0 1 0-2-2M2 10h11a2 2 0 1 1-2 2"/></svg>`,
  rain: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 9.5a3 3 0 0 1 .4-6 4 4 0 0 1 7.3 1.3 2.4 2.4 0 0 1-.2 4.7z"/><path d="M5.5 11.5l-.8 2M8.5 11.5l-.8 2M11.5 11.5l-.8 2"/></svg>`,
  roof: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 13.5V8a6.5 5 0 0 1 13 0v5.5z"/><path d="M1.5 13.5h13"/></svg>`,
};

function recRows(g, kind){
  return windowRows(g, kind).map(r => mrow(
    `<span class="c l num">${esc(r.a?.rec ?? "–")} <span class="${sgnCls(r.a?.m)}">${sgn(r.a?.m)}</span></span>`,
    mid(r.label, r.label === String(D.season) && r.a ? `${r.a.n} / ${r.h?.n ?? 0} games` : ""),
    `<span class="c r num"><span class="${sgnCls(r.h?.m)}">${sgn(r.h?.m)}</span> ${esc(r.h?.rec ?? "–")}</span>`)).join("");
}

function tileBody(g, view){
  const a = g.away, h = g.home, ha = hurtCount(a), hh = hurtCount(h);
  const hurtRows = `<h5>Hurt starters</h5>
    ${mrow(hurtSpan(ha.o, "off"), mid("Offense", "vs defense"), hurtSpan(hh.d, "def", true))}
    ${mrow(hurtSpan(ha.d, "def"), mid("Defense", "vs offense"), hurtSpan(hh.o, "off", true))}`;
  const ptsRows = `${mrow(cellL(mv(a, "off_ppg")), mid("Points scored", "vs points allowed"), cellR(mv(h, "def_ppg")))}
    ${mrow(cellL(mv(a, "def_ppg")), mid("Points allowed", "vs points scored"), cellR(mv(h, "off_ppg")))}`;
  const head = `<div class="mhead"><span><b>${a}</b> away</span><span></span><span>home <b>${h}</b></span></div>`;
  if (view === "ou"){
    const v = [fnum(mv(a, "off_ppg")[0]), fnum(mv(h, "def_ppg")[0]), fnum(mv(h, "off_ppg")[0]), fnum(mv(a, "def_ppg")[0])];
    const est = v.every(x => x != null) ? (v[0] + v[1]) / 2 + (v[2] + v[3]) / 2 : null;
    const diff = est != null && g.total != null ? est - g.total : null;
    return `${head}<h5>Scoring matchups</h5>${ptsRows}
      ${est == null ? "" : `<div class="est"><span><b>Points estimate</b><small>avg of the rows above · not a model</small></span>
        <span class="r"><b class="num">${est.toFixed(1)}</b>${diff == null ? "" : `<small class="num ${sgnCls(diff)}">${Math.abs(diff).toFixed(1)} ${diff >= 0 ? "over" : "under"} total</small>`}</span></div>`}
      <h5>Pace</h5>
      ${mrow(cellL(mv(a, "pace_plays"), rkN), mid("Plays / game", "rank 1 = most"), cellR(mv(h, "pace_plays"), rkN))}
      ${mrow(cellL(mv(a, "pace_sec"), rkN), mid("Sec / snap", "rank 1 = fastest"), cellR(mv(h, "pace_sec"), rkN))}
      ${hurtRows}
      <h5>O/U record (overs-unders) · avg vs line</h5>${recRows(g, "ou")}`;
  }
  return `${head}<h5>Matchups</h5>
    ${mrow(cellL(mv(a, "off_epa")), mid("Off EPA / play", "vs def EPA allowed"), cellR(mv(h, "def_epa")))}
    ${mrow(cellL(mv(a, "def_epa")), mid("Def EPA allowed", "vs off EPA / play"), cellR(mv(h, "off_epa")))}
    ${ptsRows}${hurtRows}
    <h5>ATS record (W-L) · avg margin vs spread</h5>${recRows(g, "ats")}`;
}

function finalStrip(g){
  if (!g.final) return "";
  const f = g.final;
  const cov = f.home_ats === "W" ? `${g.home} covered` : f.home_ats === "L" ? `${g.away} covered` : f.home_ats === "P" ? "ATS push" : "";
  const ou = f.ou === "OVER" ? "Over" : f.ou === "UNDER" ? "Under" : f.ou ? "Total push" : "";
  return `<div class="final"><span class="num"><b>Final</b> ${g.away} ${f.away} – ${f.home} ${g.home}</span><span>${[cov, ou].filter(Boolean).join(" · ")}</span></div>`;
}

function condStat(rec){
  return `<span class="num">${esc(rec ?? "–")}</span>`;
}
function condensedStrip(g){
  // Last-3-games ATS and O/U records for both teams -- enough to scan a
  // slate quickly. windowRows()[1] is "Last 3 games" (index 0 is the
  // season-to-date row); see ENTRIES above.
  const ats3 = windowRows(g, "ats")[1], ou3 = windowRows(g, "ou")[1];
  return `<div class="cond-stats">
    <div class="cond-row"><span class="cond-k">ATS L3</span>${condStat(ats3?.a?.rec)}<span class="cond-mid">·</span>${condStat(ats3?.h?.rec)}</div>
    <div class="cond-row"><span class="cond-k">O/U L3</span>${condStat(ou3?.a?.rec)}<span class="cond-mid">·</span>${condStat(ou3?.h?.rec)}</div>
  </div>`;
}

function gameTile(g){
  const view = state.tileView[g.id] || "spread";
  const expanded = state.tileExpanded.has(g.id);
  const when = `${(g.weekday || "").slice(0, 3)} ${fmtKick(g.time)} ET`;
  return `<article class="gtile ${expanded ? "" : "is-condensed"}" id="g-${g.id}">
    <a class="ghead" href="#game=${g.id}">
      <span class="gteams">${g.away}<span class="at">@</span>${g.home}</span>
      <span class="gmeta"><span>${esc(when)}</span><span class="more-link">Details ›</span></span>
    </a>
    <div class="cond-line">
      <span class="cond-spread num">${esc(spreadText(g))}</span>
      ${condensedStrip(g)}
      <button type="button" class="expand-btn" data-expand="${g.id}" aria-expanded="${expanded}">${expanded ? "Less ▲" : "More ▼"}</button>
    </div>
    ${expanded ? `
    <div class="sw" role="group" aria-label="Summary for ${g.away} at ${g.home}">
      <button type="button" data-tile="${g.id}" data-v="spread" aria-pressed="${view === "spread"}">Spread <span class="num">${esc(spreadText(g))}</span></button>
      <button type="button" data-tile="${g.id}" data-v="ou" aria-pressed="${view === "ou"}">Over/Under <span class="num">${g.total ?? "–"}</span></button>
    </div>
    ${finalStrip(g)}
    ${weatherStrip(g, false)}
    <div class="mt">${tileBody(g, view)}</div>` : ""}
  </article>`;
}

function weekBar(selected){
  const items = [
    ...D.weeks.map(w => ({week: w.week, label: w.week === D.current_week ? "upcoming" : "next week"})),
    ...(D.results_weeks || []).map(w => ({week: w.week, label: "results"})),
  ].sort((a, b) => b.week - a.week);
  return `<div class="seg" role="group" aria-label="Week">
    ${items.map(x => `<button type="button" id="wk-${x.week}" data-week="${x.week}" aria-pressed="${x.week === selected}">Week ${x.week} · ${x.label}</button>`).join("")}
  </div>`;
}

const BOX_STATS = [
  ["epa", "EPA / play", v => sgn(v, 3)],
  ["pass_epa", "Pass EPA / play", v => sgn(v, 3)],
  ["rush_epa", "Rush EPA / play", v => sgn(v, 3)],
  ["success", "Success rate", v => pct1(v)],
  ["yards", "Yards", v => v == null ? "–" : String(Math.round(v))],
  ["third_pct", "3rd down %", v => pct1(v)],
  ["rz_pct", "Red zone TD %", v => pct1(v)],
  ["giveaways", "Giveaways", v => v == null ? "–" : String(Math.round(v))],
  ["sacks_taken", "Sacks taken", v => v == null ? "–" : String(Math.round(v))],
  ["explosive_rate", "Explosive play %", v => pct1(v)],
];
const pct1 = v => v == null ? "–" : `${Math.round(v * 100)}%`;

function resultTile(g){
  const box = g.box || {};
  const boxAway = box[g.away], boxHome = box[g.home];
  const rows = (boxAway && boxHome) ? BOX_STATS.map(([k, label, fmt]) => `<div class="mrow">
      <span class="c l num">${fmt(boxAway[k])}</span>
      <span class="mid"><span>${label}</span></span>
      <span class="c r num">${fmt(boxHome[k])}</span>
    </div>`).join("") : "";
  return `<article class="gtile is-result">
    <div class="ghead">
      <span class="gteams">${g.away}<span class="at">@</span>${g.home}</span>
      <span class="gmeta"><span>${(g.weekday || "").slice(0, 3)} ${esc(g.date.slice(5))}</span></span>
    </div>
    <div class="final"><span class="num"><b>Final</b> ${g.away} ${g.final.away} – ${g.final.home} ${g.home}</span>${g.stadium ? `<span>${esc(g.stadium)}</span>` : ""}</div>
    ${rows ? `<div class="mt"><div class="mhead"><span><b>${g.away}</b></span><span></span><span><b>${g.home}</b></span></div>${rows}</div>`
      : `<p class="meta" style="margin:0">Play-by-play stats aren't loaded for this game.</p>`}
  </article>`;
}

function renderResultsWeek(week){
  const W = D.results_weeks.find(w => w.week === week);
  const byDay = [];
  for (const g of W.games){
    const last = byDay[byDay.length - 1];
    if (last && last.date === g.date) last.games.push(g); else byDay.push({date: g.date, weekday: g.weekday, games: [g]});
  }
  app.innerHTML = `
    <div class="weekbar">
      <h2>Week ${W.week}</h2>
      ${weekBar(week)}
      <span class="sub">${W.games.length} games · final</span>
    </div>
    <p class="meta" style="margin:0 0 14px;max-width:70ch">Final scores and what actually happened on the field: EPA per play, success rate, yards, red zone and third-down rates, turnovers and sacks. No lines, covers or records here -- see This week for the current slate.</p>
    ${byDay.map(d => `<section class="day"><h3>${fmtDate(d.date, d.weekday)}</h3><div class="tiles-grid">${d.games.map(resultTile).join("")}</div></section>`).join("")}
  `;
}

function renderWeek(){
  if (isResultsWeek(state.week)){ renderResultsWeek(state.week); return; }
  const W = currentWeek();
  const route = parseRoute();
  if (route.game){
    const wk = D.weeks.find(w => w.games.some(x => x.id === route.game));
    if (wk){
      state.week = wk.week;
      renderGame(wk.games.find(x => x.id === route.game), route.tab);
      return;
    }
  }
  const played = W.games.filter(g => g.final).length;
  const byDay = [];
  for (const g of W.games){
    const last = byDay[byDay.length - 1];
    if (last && last.date === g.date) last.games.push(g); else byDay.push({date: g.date, weekday: g.weekday, games: [g]});
  }
  const anyStale = Object.values(W.avail || {}).some(a => !a.current);
  app.innerHTML = `
    <div class="weekbar">
      <h2>Week ${W.week}</h2>
      ${weekBar(W.week)}
      <span class="sub">${W.games.length} games · ${played} played</span>
    </div>
    <details class="guide" id="guide"><summary>How to read this board</summary><div>
      <p><b>Each tile</b> has two summaries: <b>Spread</b> and <b>Over/Under</b>. The away team is always on the left and the home team on the right. Each middle row lines up one team's offense against the other team's defense.</p>
      <p><b>Ranks</b>: #1 is the best in the league on both sides of the ball. Green means top 10 and red means bottom 10. Pace ranks aren't colored because fast or slow isn't good or bad.</p>
      <p><b>The numbers</b> blend ${D.season - 1} and ${D.season}: this season counts for its games played ÷ 6. Each game only uses results from before its kickoff.</p>
      <p><b>Records</b>: ATS is wins-losses against the spread; O/U is overs-unders. The number after a record is the average margin: points the team beat (+) or missed (−) the spread by, or points its games went over (+) or under (−) the total. "Last 10" includes playoffs and last season.</p>
      <p><b>Points estimate</b> is the simple average of the two scoring rows, compared with the total. It isn't a model.</p>
      <p><b>Weather</b> is the kickoff-hour forecast from Open-Meteo, refreshed with the board. A game is flagged at ${D.weather_flags?.wind ?? 15}+ mph wind or a ${D.weather_flags?.rain ?? 50}%+ chance of rain.</p>
      <p><b>Details ›</b> opens the game page: game logs, roster and depth chart with injuries, and full ATS and O/U splits.</p>
      <p>Tiles start condensed -- teams, kickoff, spread, and each team's last 3 games ATS and O/U. Tap <b>More ▼</b> for the full matchup breakdown.</p>
      <p>Next week's slate joins the board from Wednesday on; the week switcher above also holds every finished week's results once its games are done.</p>
      ${anyStale ? `<p>This week's injury reports aren't all out yet (teams file Wednesday to Friday), so some hurt-starter counts use last week's report.</p>` : ""}
    </div></details>
    ${byDay.map(d => `<section class="day"><h3>${fmtDate(d.date, d.weekday)}</h3><div class="tiles-grid">${d.games.map(gameTile).join("")}</div></section>`).join("")}
    <p class="foot">Kickoff times are Eastern. Data: nflverse (schedules, lines, play-by-play, depth charts, injuries) and Open-Meteo (weather). Results through ${esc(D.results_through)}. Lines update with each refresh, so check current prices at your sportsbook before betting.</p>
  `;
}

/* ---------------------------- Game page ----------------------------- */
function parseRoute(){
  const p = new URLSearchParams(location.hash.slice(1));
  return {game: p.get("game"), tab: p.get("tab") || "logs"};
}
const GTABS = [["logs", "Game logs"], ["roster", "Roster"], ["ats", "ATS"], ["ou", "O/U"]];

function teamSwitch(g, team){
  return `<div class="sw" role="group" aria-label="Team">
    ${[g.away, g.home].map((t, i) => `<button type="button" data-gteam="${t}" aria-pressed="${t === team}">${t} <span class="soft">${i ? "home" : "away"}</span></button>`).join("")}
  </div>`;
}
function lineTxt(v){ return v == null ? "–" : v === 0 ? "PK" : v > 0 ? `${minus}${v}` : `+${-v}`; }
const GT = {WC: "WC", DIV: "DIV", CON: "CONF", SB: "SB"};

function logsPane(t){
  const log = D.teamx?.[t]?.log || [];
  const seasons = [D.season, D.season - 1];
  return seasons.map(s => {
    const rows = log.filter(r => r.s === s);
    const w = rows.filter(r => r.ats === "W").length, l = rows.filter(r => r.ats === "L").length, p = rows.filter(r => r.ats === "P").length;
    const o = rows.filter(r => r.ou === "OVER").length, u = rows.filter(r => r.ou === "UNDER").length;
    return `<div class="card">
      <div class="card-h"><h4>${s}</h4><span class="num soft">${rows.length ? `ATS ${w}-${l}${p ? "-" + p : ""} · O/U ${o}-${u}` : ""}</span></div>
      ${rows.length ? `<div class="lg lg-h"><span>Wk</span><span>Opp</span><span>Result</span><span class="r">Line</span><span class="ctr">ATS</span><span class="r">Total</span><span class="ctr">O/U</span></div>
      ${rows.map(r => {
        const res = r.pf > r.pa ? "W" : r.pf < r.pa ? "L" : "T";
        const od = r.tot != null && r.tl != null ? r.tot - r.tl : null;
        return `<div class="lg num">
          <span class="soft">${GT[r.gt] || r.wk}</span><span class="opp">${r.home ? "vs" : "@"} ${r.opp}</span><span>${res} ${r.pf}-${r.pa}</span>
          <span class="r">${lineTxt(r.line)}</span>
          <span class="ctr stack"><b class="res ${r.ats === "W" ? "cov" : r.ats === "L" ? "miss" : ""}">${r.ats || "–"}</b><small class="${sgnCls(r.am)}">${r.am == null ? "" : sgn(r.am, 1).replace(".0", "")}</small></span>
          <span class="r">${r.tl ?? "–"}</span>
          <span class="ctr stack"><b class="res ${r.ou === "OVER" ? "over" : r.ou === "UNDER" ? "under" : ""}">${r.ou === "OVER" ? "O" : r.ou === "UNDER" ? "U" : r.ou ? "P" : "–"}</b><small class="${sgnCls(od)}">${od == null ? "" : sgn(od, 1).replace(".0", "")}</small></span>
        </div>`;
      }).join("")}` : `<p class="meta">No completed games yet.</p>`}
    </div>`;
  }).join("") + `<p class="meta">Line is the team's spread (− = favored). The number under ATS is how many points the team beat (+) or missed (−) the spread by; under O/U it's total points minus the closing total. Playoff games are labeled WC, DIV, CONF and SB.</p>`;
}

const TAG_TEXT = {out: "Out", doubtful: "Doubtful", questionable: "Questionable", limited: "Limited practice"};
function tagFor(p){
  if (p.x === "active") return "";
  const label = p.x === "out" ? (SHORT[p.rs] || "OUT") : p.x === "doubtful" ? "D" : p.x === "questionable" ? "Q" : "LP";
  return `<span class="tag ${p.x}">${label}</span>`;
}
function depthGrid(t, side){
  const av = currentWeek().avail?.[t];
  const players = (av?.depth || []).filter(p => p.s === side);
  if (!players.length) return `<p class="meta">No depth chart loaded.</p>`;
  const rows = new Map();
  for (const p of players){
    const k = p.sl ?? p.p;
    if (!rows.has(k)) rows.set(k, []);
    rows.get(k).push(p);
  }
  const sel = state.depthSel;
  let selP = null, selDepth = null;
  const body = [...rows.values()].map((ps, ri) => {
    ps.sort((a, b) => a.r - b.r);
    const cells = [0, 1, 2, 3].map(i => {
      const p = ps[i];
      if (!p) return `<div class="dc ${i ? "" : "st"}"><span class="soft">–</span></div>`;
      const key = `${t}|${p.p}|${p.n}`;
      if (key === sel){ selP = p; selDepth = ["starter", "2nd", "3rd", "4th"][i]; }
      const inner = p.x === "active"
        ? `<span>${esc(p.n)}</span>`
        : `<button type="button" class="dbtn ${key === sel ? "on" : ""}" data-dsel="${esc(key)}">${esc(p.n)} ${tagFor(p)}</button>`;
      return `<div class="dc ${i ? "" : "st"}">${inner}</div>`;
    }).join("");
    return `<div class="dr ${ri % 2 ? "alt" : ""}"><div class="dp num">${esc(ps[0].p)}</div>${cells}</div>`;
  }).join("");
  const form = players[0].f || "";
  const detail = selP ? (() => {
    const bits = [];
    if (selP.inj) bits.push(esc(selP.inj));
    if (selP.pr) bits.push(esc(selP.pr.replace(" Participation in Practice", " practice").replace(" in Practice", "")));
    if (selP.rs && !SHORT[selP.rs] && selP.rs !== TAG_TEXT[selP.x] && !selP.inj) bits.push(esc(selP.rs));
    if (selP.sh != null) bits.push(`${Math.round(selP.sh * 100)}% of snaps (${esc(selP.sb)})`);
    if (selP.rp) bits.push(`next up ${esc(selP.rp)}${selP.rsh != null ? ` (${Math.round(selP.rsh * 100)}% of snaps)` : ""}`);
    const tagWord = selP.x === "out" ? (selP.rs || "Out") : TAG_TEXT[selP.x];
    return `<div class="dsel ${selP.x}"><div class="dsel-h"><b>${esc(selP.n)} <small class="num">${esc(selP.p)} · ${selDepth}</small></b><span class="tagword">${esc(tagWord)}</span></div>
      <div>${bits.join(" · ") || "No other details on the report."}</div>
      <button type="button" class="linkish" data-dsel="">Close</button></div>`;
  })() : "";
  return `<div class="card flush">
    <div class="card-h pad"><h4>${side === "O" ? "Offense" : "Defense"}</h4><span class="soft strong">${esc(form)}</span></div>
    <div class="dwrap"><div class="dtable">
      <div class="dr dhead"><div class="dp"></div><div class="dc st">Starter</div><div class="dc">2nd</div><div class="dc">3rd</div><div class="dc">4th</div></div>
      ${body}
    </div></div>
    ${detail}
    <p class="meta pad">Swipe the table for 2nd–4th. Tap a tagged player for injury details.</p>
  </div>`;
}
function changesBox(t){
  const c = D.teamx?.[t]?.changes;
  if (!c) return "";
  const pct = v => v == null ? "" : `${Math.round(v * 100)}%`;
  const newTxt = n => n.how === "added" ? `was ${n.from} · ${pct(n.share)} of snaps` : n.how === "promoted" ? `promoted · was ${pct(n.share)}` : "no 2025 NFL snaps";
  const person = (x, label) => !x.now ? "–" : `${esc(x.now)} ${x.changed ? `<b class="chg">new · was ${esc(x.prior)}</b>` : `<span class="soft">(same as ${D.season - 1})</span>`}`;
  const whereCls = w => w.startsWith("now ") || w === "not on a roster" ? "gone" : "";
  return `<div class="card changes">
    <h4>Key changes vs ${D.season - 1}</h4>
    <p>${c.new_starters.length} of ${c.starters} starting spots changed since ${D.season - 1}${c.qb.changed || c.coach.changed ? ", including the " + [c.qb.changed ? "quarterback" : "", c.coach.changed ? "head coach" : ""].filter(Boolean).join(" and ") : ""}. Last season's records were built with a different lineup.</p>
    <div class="kv"><span class="soft">QB</span><span>${person(c.qb)}</span><span class="soft">Coach</span><span>${person(c.coach)}</span></div>
    <h5>New starters</h5>
    ${c.new_starters.length ? c.new_starters.map(n => `<div class="chrow"><span class="num soft">${esc(n.pos)}</span><span class="nm">${esc(n.name)}</span><span class="soft r">${newTxt(n)}</span></div>`).join("") : `<p class="meta">Same starters as last season.</p>`}
    <h5>Gone from ${D.season - 1}'s starting lineup</h5>
    ${c.lost_starters.length ? c.lost_starters.map(n => `<div class="chrow"><span class="num soft">${esc(n.pos)}</span><span class="nm">${esc(n.name)} <small class="num soft">${pct(n.share)}</small></span><span class="r ${whereCls(n.where)}">${esc(n.where)}</span></div>`).join("") : `<p class="meta">Every 50%+ snap player from last season is still starting.</p>`}
    <p class="meta">Starters come from the latest depth chart; "starter last season" means 50%+ of snaps over 6+ games. Name matching between data sources can occasionally miss a player.</p>
  </div>`;
}
function rosterPane(t){
  const av = currentWeek().avail?.[t];
  const note = !av ? "" : av.report_week == null ? "No injury report has been filed yet this season."
    : av.current ? `Week ${av.report_week} injury report.`
    : `The week ${av.week} injury report isn't out yet (teams file Wednesday to Friday), so tags come from week ${av.report_week}.`;
  return `${changesBox(t)}${av ? hurtLastGameBlock(av) : ""}${depthGrid(t, "O")}${depthGrid(t, "D")}
    <p class="meta">${note} Tags: Q questionable, D doubtful, OUT, IR injured reserve, PUP / NFI other reserve lists, RES other reserve list, LP limited practice. Depth chart snapshot ${esc(av?.snapshot || "")}.</p>`;
}
function splitCell(x, right){
  if (!x || !x.n) return `<span class="c ${right ? "r" : "l"} stack2"><span class="num">–</span><small class="soft">no games</small></span>`;
  const m = `<span class="${sgnCls(x.m)}">${sgn(x.m)}</span>`;
  return `<span class="c ${right ? "r" : "l"} stack2">
    <span class="num big">${right ? m + " " + esc(x.rec) : esc(x.rec) + " " + m}</span>
    <small class="num soft">n=${x.n}${x.moe != null ? " · ±" + Math.round(x.moe) : ""}</small>
    ${x.sig ? `<span class="sig">signal</span>` : ""}</span>`;
}
function barsBlock(g, kind){
  const col = side => {
    const t = g[side];
    const rows = (g.trends?.[side]?.recent || []).map(r => ({
      opp: r.opp, d: r.d, v: kind === "ats" ? r.m : (r.tot != null && r.tl != null ? r.tot - r.tl : null),
    }));
    const ordered = rows.slice().reverse();   // most recent at top
    const max = Math.max(1, ...ordered.map(r => Math.abs(r.v ?? 0)));
    return `<div class="bars"><b>${t}</b>${ordered.map(r => `<div class="bar-row"><span class="num soft">${r.opp}</span>
      <span class="bar-track">${r.v == null ? "" : `<i class="${r.v > 0 ? "up" : "down"}" style="width:${(Math.abs(r.v) / max * 50).toFixed(1)}%"></i>`}</span>
      <span class="num r">${r.v == null ? "–" : sgn(r.v, 1).replace(".0", "")}</span></div>`).join("")}</div>`;
  };
  const since = D.chart_since_season ?? 2025;
  return `<div class="card"><h4>${kind === "ats" ? "Cover margin" : "Points vs total"} since ${since}</h4>
    <div class="bars2">${col("away")}${col("home")}</div>
    <p class="meta">Most recent at top. Blue = ${kind === "ats" ? "covered" : "over"}, orange = ${kind === "ats" ? "missed" : "under"}. Includes playoffs.</p></div>`;
}
function splitsPane(g, kind){
  const A = g.splits?.away || [], H = g.splits?.home || [];
  const rows = A.map((a, i) => {
    const h = H[i] || {};
    const sub = a.label === "Head to head" ? `since ${a.sub.split("since ")[1] || ""}`
      : a.label === "All games" ? a.sub : `${g.away} ${a.sub.replace("on the road", "road").replace("at home", "home")} · ${g.home} ${(h.sub || "").replace("on the road", "road").replace("at home", "home")}`;
    return mrow(splitCell(a[kind]), mid(a.label, sub), splitCell(h[kind], true));
  }).join("");
  return `<div class="card">
    <h4>${kind === "ats" ? "ATS splits" : "O/U splits"}</h4>
    <p class="meta tight">${kind === "ats" ? "Record (W-L) and average margin vs the spread" : "Record (overs-unders) and average points vs the total"}, ${D.season - 2}–${String(D.season).slice(2)} unless noted</p>
    <div class="mhead"><span><b>${g.away}</b></span><span></span><span><b>${g.home}</b></span></div>
    ${rows}
    <p class="meta">n = games, ± = 95% margin of error. "signal" appears only with 10+ games and a record farther from 50% than the margin of error.</p>
  </div>${barsBlock(g, kind)}`;
}

function renderGame(g, tab){
  if (!GTABS.some(([k]) => k === tab)) tab = "logs";
  if (!state.gameTeam || ![g.away, g.home].includes(state.gameTeam)) state.gameTeam = g.away;
  const team = state.gameTeam;
  const when = `${fmtDate(g.date, g.weekday)} · ${fmtKick(g.time)} ET`;
  const pane = tab === "logs" ? teamSwitch(g, team) + logsPane(team)
    : tab === "roster" ? teamSwitch(g, team) + rosterPane(team)
    : splitsPane(g, tab);
  app.innerHTML = `<div class="gpage">
    <div class="ghero">
      <div class="ghero-top"><a href="#" class="back">‹ Week ${currentWeek().week}</a><span>${esc(when)}</span></div>
      <div class="ghero-main">
        <div><h2>${g.away}<span class="at">@</span>${g.home}</h2><p>${TEAM_FULL(g.away)} at ${TEAM_FULL(g.home)}${g.stadium ? " · " + esc(g.stadium) : ""}</p></div>
        <div class="chips2"><div class="chipbox hot"><small>SPREAD</small><b class="num">${esc(spreadText(g))}</b></div><div class="chipbox"><small>O/U</small><b class="num">${g.total ?? "–"}</b></div></div>
      </div>
      ${finalStrip(g)}
      ${weatherStrip(g, true)}
    </div>
    <nav class="gtabs" role="tablist">${GTABS.map(([k, l]) => `<a role="tab" href="#game=${g.id}&tab=${k}" aria-selected="${k === tab}">${l}</a>`).join("")}</nav>
    <div class="gbody">${pane}</div>
  </div>`;
}

function teamAvailability(t){
  const W = D.weeks.find(w => w.week === D.current_week) || D.weeks[0];
  const av = W.avail?.[t];
  if (!av) return `<p class="meta">${t} isn't playing in week ${D.current_week}, so its latest depth chart isn't included.</p>`;
  const saved = state.week; state.week = W.week;
  const html = availabilityPanel(t).replace(/^<div class="block"><h4>.*?<\/h4>/, '<div class="block">');
  state.week = saved;
  return html;
}

function renderTeams(){
  const t = state.team, T = D.teams[t], M = D.latest_metrics[t];
  const metricRows = (defs) => defs.map(([k, label, hb]) => {
    const [v, r] = M?.v?.[k] || [null, null];
    const pos = r == null ? null : ((r - 1) / 31) * 100;
    return `<tr><td>${esc(label)}</td><td class="r num">${esc(v ?? "–")}</td><td class="r">${rk(r)}</td>
      <td style="width:28%"><div class="bar" title="#1 on the left, #32 on the right">${pos == null ? "" : `<i style="left:${pos}%"></i>`}</div></td></tr>`;
  }).join("");
  const tile = (k, r, extra) => `<div class="tile"><div class="k">${k}</div><div class="v">${r?.n ? esc(r.record) : "–"}</div><div class="s">${r?.n ? `${extra ?? r.pct + "%"} · n=${r.n} · ±${r.moe}` : "no games"}${r?.sig ? ' <span class="sig">signal</span>' : ""}</div></div>`;

  app.innerHTML = `
    <div class="picker" role="group" aria-label="Team">
      ${Object.keys(D.teams).sort().map(x => `<button type="button" id="tm-${x}" data-team="${x}" aria-pressed="${x === t}" title="${NAMES[x] || x}">${x}</button>`).join("")}
    </div>
    <div class="t-head"><h2>${t} ${NAMES[t] || ""}</h2><p>${esc(M?.note ?? "")}</p></div>
    <div class="tiles">
      ${tile("ATS overall", T.ats)}${tile("ATS at home", T.ats_home)}${tile("ATS on the road", T.ats_away)}${tile("Over / under", T.ou, T.ou.n ? T.ou.pct + "% over" : "")}
    </div>
    <p class="meta" style="margin:-12px 0 0">ATS: ${D.n_seasons} seasons through ${D.through}, regular season.</p>
    <div class="pair section">
      <div class="block"><h3 class="sec-h">Offense</h3><div class="tbl-wrap"><table><thead><tr><th>Stat</th><th class="r">Value</th><th class="r">Rank</th><th>League position</th></tr></thead><tbody>${metricRows(OFF)}</tbody></table></div></div>
      <div class="block"><h3 class="sec-h">Defense</h3><div class="tbl-wrap"><table><thead><tr><th>Stat</th><th class="r">Value</th><th class="r">Rank</th><th>League position</th></tr></thead><tbody>${metricRows(DEF)}</tbody></table></div></div>
    </div>
    <section class="section"><h3 class="sec-h">Luck check</h3>
      ${luckBlock(T.luck_now, D.season + " so far")}${luckBlock(T.luck_prior, String(D.season - 1))}
    </section>
    <section class="section"><h3 class="sec-h">Depth chart and injuries</h3>${teamAvailability(t)}</section>
    <section class="section"><h3 class="sec-h">Trends</h3>
      <div class="pair"><div>${anglesTable(T.angles, "ats")}</div><div>${anglesTable(T.angles, "ou")}</div></div>
      <h3 class="sec-h" style="margin-top:14px">Last ${T.recent.length} games vs the spread</h3>${recentChart(T.recent, t)}
    </section>
    <section class="section"><h3 class="sec-h">Against the spread, by situation</h3>${splitsTable(t)}
      <p class="meta">Read n first. A ${T.splits[1]?.r ?? ""} record over ${T.splits[1]?.n ?? 0} games carries a ±${T.splits[1]?.m ?? "–"} point margin of error.</p>
    </section>
    <p class="foot">Metrics blend 2025 and 2026 and include every game played so far. Rank #1 is the best in the league.</p>
  `;
}

function render(){
  if (parseRoute().game && state.view !== "week"){ state.view = "week"; }
  document.getElementById("tab-week").setAttribute("aria-pressed", state.view === "week");
  document.getElementById("tab-teams").setAttribute("aria-pressed", state.view === "teams");
  (state.view === "teams" ? renderTeams : renderWeek)();
}

document.getElementById("stamp").textContent =
  `${D.season} · results through ${new Date(D.results_through + "T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})} · updated ${new Date(D.generated).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}`;

document.querySelector(".top .seg").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]"); if (!b) return;
  state.view = b.dataset.view; store.set("view", state.view);
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  render(); window.scrollTo(0, 0);
});
app.addEventListener("click", e => {
  const tv = e.target.closest("button[data-tile]");
  if (tv){
    state.tileView[tv.dataset.tile] = tv.dataset.v;
    const el = document.getElementById("g-" + tv.dataset.tile);
    if (el) el.outerHTML = gameTile(findGame(tv.dataset.tile));
    return;
  }
  const ex = e.target.closest("button[data-expand]");
  if (ex){
    const id = ex.dataset.expand;
    if (state.tileExpanded.has(id)) state.tileExpanded.delete(id); else state.tileExpanded.add(id);
    const el = document.getElementById("g-" + id);
    if (el) el.outerHTML = gameTile(findGame(id));
    return;
  }
  const gt = e.target.closest("button[data-gteam]");
  if (gt){ state.gameTeam = gt.dataset.gteam; state.depthSel = null; render(); return; }
  const ds = e.target.closest("button[data-dsel]");
  if (ds){ state.depthSel = ds.dataset.dsel && ds.dataset.dsel !== state.depthSel ? ds.dataset.dsel : null; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const back = e.target.closest("a.back");
  if (back){
    e.preventDefault();
    const id = parseRoute().game;
    history.pushState(null, "", location.pathname + location.search);
    render();
    const el = id && document.getElementById("g-" + id);
    if (el) el.scrollIntoView({block: "start"}); else window.scrollTo(0, 0);
    return;
  }
  const w = e.target.closest("button[data-week]");
  if (w){ state.week = Number(w.dataset.week); store.set("week", state.week); render(); return; }
  const t = e.target.closest("button[data-team]");
  if (t){ state.team = t.dataset.team; store.set("team", state.team); render(); return; }
  const tb = e.target.closest("button[data-tab]");
  if (tb){
    state.tabs[tb.dataset.game] = tb.dataset.tab;
    const body = app.querySelector(`[data-body="${tb.dataset.game}"]`);
    if (body){ body.innerHTML = gameBody(findGame(tb.dataset.game)); document.getElementById(`tab-${tb.dataset.game}-${tb.dataset.tab}`)?.focus(); }
    return;
  }
  const j = e.target.closest("button[data-jump]");
  if (j){
    const el = document.getElementById("g-" + j.dataset.jump);
    if (j.dataset.openTab){ state.tabs[j.dataset.jump] = j.dataset.openTab; const b = el?.querySelector(".body"); if (b && el.open) b.innerHTML = gameBody(findGame(j.dataset.jump)); }
    if (el){ el.open = true; el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"}); }
  }
});
app.addEventListener("toggle", e => {
  const d = e.target;
  if (d.matches && d.matches("details.game")){
    if (d.open){
      state.open.add(d.dataset.id);
      const b = d.querySelector(".body");
      if (b && !b.innerHTML.trim()) b.innerHTML = gameBody(findGame(d.dataset.id));
    } else state.open.delete(d.dataset.id);
  }
  if (d.id === "model-table") state.modelOpen = d.open;
}, true);

function showTip(e){
  const r = e.target.closest && e.target.closest("rect.hit");
  if (!r){ tip.hidden = true; return; }
  tip.innerHTML = r.dataset.tip;
  tip.hidden = false;
  const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  const y = Math.max(8, e.clientY - tip.offsetHeight - 12);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
app.addEventListener("pointermove", showTip);
app.addEventListener("pointerdown", showTip);
app.addEventListener("pointerleave", () => { tip.hidden = true; });
window.addEventListener("scroll", () => { tip.hidden = true; }, {passive: true});

let lastGame = parseRoute().game;
window.addEventListener("hashchange", () => {
  const r = parseRoute();
  if (r.game !== lastGame){ state.depthSel = null; state.gameTeam = null; }
  const wasGame = lastGame;
  lastGame = r.game;
  render();
  if (r.game && r.game !== wasGame) window.scrollTo(0, 0);
  else if (!r.game && wasGame){ const el = document.getElementById("g-" + wasGame); if (el) el.scrollIntoView({block: "start"}); }
});

render();
})();
</script>
