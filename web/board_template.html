    if (wk){
      state.week = wk.week;
      renderGame(wk.games.find(x => x.id === route.game), route.tab);
      return;
    }
  }
  if (isResultsWeek(state.week)){ renderResultsWeek(state.week); return; }
  const W = currentWeek();
  const played = W.games.filter(g => g.final).length;
  const byDay = [];
  for (const g of W.games){
    const last = byDay[byDay.length - 1];
    if (last && last.date === g.date) last.games.push(g); else byDay.push({date: g.date, weekday: g.weekday, games: [g]});
  }
  const anyStale = Object.values(W.avail || {}).some(a => !a.current);
  app.innerHTML = `
    <div class="weekbar">
      <h2>Week ${W.week}</h2>
      ${weekBar(W.week)}
      <span class="sub">${W.games.length} games · ${played} played</span>
    </div>
    <details class="guide" id="guide"><summary>How to read this board</summary><div>
      <p><b>Each tile</b> has two summaries: <b>Spread</b> and <b>Over/Under</b>. The away team is always on the left and the home team on the right. Each middle row lines up one team's offense against the other team's defense.</p>
      <p><b>Ranks</b>: #1 is the best in the league on both sides of the ball. Green means top 10 and red means bottom 10. Pace ranks aren't colored because fast or slow isn't good or bad.</p>
      <p><b>The numbers</b> blend ${D.season - 1} and ${D.season}: this season counts for its games played ÷ 6. Each game only uses results from before its kickoff.</p>
      <p><b>Records</b>: ATS is wins-losses against the spread; O/U is overs-unders. The number after a record is the average margin: points the team beat (+) or missed (−) the spread by, or points its games went over (+) or under (−) the total. "Last 10" includes playoffs and last season.</p>
      <p><b>Points estimate</b> is the simple average of the two scoring rows, compared with the total. It isn't a model.</p>
      <p><b>Weather</b> is the kickoff-hour forecast from Open-Meteo, refreshed with the board. "Updated" is when it was fetched, and how far ahead of kickoff: forecasts a day out are far more reliable than ones a week out. A game is flagged at ${D.weather_flags?.wind ?? 15}+ mph wind or a ${D.weather_flags?.rain ?? 50}%+ chance of rain.</p>
      <p><b>Details ›</b> opens the game page: game logs, an EPA matchup (total, pass and rush), roster and depth chart with injuries, and full ATS and O/U splits.</p>
      <p><b>Injury timing</b>: tap a tagged player on the Roster tab. "Hurt in the Week 5 game" comes straight from the play-by-play, including whether he returned. Anything else is inferred from when he first appeared on a list. "First listed this week" without a game injury usually means practice, illness or a hit the charting missed. "Status last changed" is the board refresh that first saw his current listing, so it's only as precise as the refresh schedule. nflverse's own update time for the injury file is shown with each team.</p>
      <p>Tiles start condensed -- teams, kickoff, spread, and each team's last 3 games ATS and O/U. Tap <b>More ▼</b> for the full matchup breakdown. The last-3 records are colored: <b>blue</b> for covers (ATS) or overs (O/U), <b>orange</b> for misses or unders. Solid means a 2+ game lead like 3-0, light means 2-1, plain means even. Three games is a tiny sample, so treat the colors as a pointer, not a signal.</p>
      <p>Next week's slate joins the board from Wednesday on; the week switcher above also holds every finished week's results once its games are done.</p>
      ${anyStale ? `<p>This week's injury reports aren't all out yet (teams file Wednesday to Friday), so some hurt-starter counts use last week's report.</p>` : ""}
      <p><b>Depth chart and injuries</b> is frozen to each team's Week 1 lineup, not today's reshuffled one -- so a Week 1 starter who's since been hurt, benched or has left the team entirely still shows in their opening slot, tagged with what's happened to them. That's on purpose: it's the easiest way to see how much a roster has actually been depleted since the season started. A <b>GONE</b> tag means the player is no longer on this team's roster at all (released, retired, or traded), which the injury report alone won't tell you.</p>
    </div></details>
    ${byDay.map(d => `<section class="day"><h3>${fmtDate(d.date, d.weekday)}</h3><div class="tiles-grid">${d.games.map(gameTile).join("")}</div></section>`).join("")}
    <p class="foot">Kickoff times are Eastern. Data: nflverse (schedules, lines, play-by-play, depth charts, injuries) and Open-Meteo (weather). Results through ${esc(D.results_through)}. Lines update with each refresh, so check current prices at your sportsbook before betting.</p>
  `;
}

/* ---------------------------- Game page ----------------------------- */
function parseRoute(){
  const p = new URLSearchParams(location.hash.slice(1));
  return {game: p.get("game"), tab: p.get("tab") || "logs"};
}
const GTABS = [["logs", "Game logs"], ["matchup", "Matchup"], ["roster", "Roster"], ["ats", "ATS"], ["ou", "O/U"], ["pick", "Pick"]];

/* ----------------------------------------------------------------------
   Pick write-up: a 5-8 sentence case FOR one bet, built from numbers
   already on this page, for pasting into a group chat. It argues one side
   on purpose, so it only uses reasons that favor the chosen bet -- but every
   number is the same one the board shows elsewhere, and a thin case says
   so rather than stretching.
   ---------------------------------------------------------------------- */
const ord = n => { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const rkWords = r => r === 1 ? "best in the NFL" : r === 32 ? "worst in the NFL" : ord(r);
const nick = t => `the ${NAMES[t] || t}`;
const poss = t => `${nick(t)}'`;                        // every nickname ends in s
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const teamLine = (g, t) => g.spread == null ? null : (t === g.home ? g.spread : -g.spread);   // + = favored by
const betLabel = (g, bet) => bet === "over" ? `Over ${g.total}` : bet === "under" ? `Under ${g.total}` : lineFor(g[bet], teamLine(g, g[bet]));
// "On the road since 2023" -> "on the road since 2023", "Last 10 games" -> "over their last 10 games".
const angleWords = a => a === `${D.season} season` ? "this season" : /^Last /.test(a) ? `over their ${a.toLowerCase()}`
  : a.replace(/^All games /, "").replace(/^(.)/, c => c.toLowerCase());
const recPct = rec => { const [w, l] = String(rec || "").split("-").map(Number); return w + l ? w / (w + l) : null; };

function pickReasons(g, bet){
  const W = currentWeek(), R = [];
  const add = (score, key, text) => R.push({score, key, text});
  const M = (t, k) => mv(t, k);
  const hurtStarters = t => (W.avail?.[t]?.depth || []).filter(p => p.st && ["out", "doubtful"].includes(p.x));

  if (bet === "away" || bet === "home"){
    const T = g[bet], O = bet === "away" ? g.home : g.away;
    // Total EPA mismatches, both directions.
    const [toV, toR] = M(T, "off_epa"), [odV, odR] = M(O, "def_epa");
    if (toR != null && odR != null && odR - toR >= 6)
      add((odR - toR) / 31 + (toR <= 8 ? 0.3 : 0), "off", `${cap(poss(T))} offense is producing ${toV} EPA per play (${rkWords(toR)}), and it draws ${poss(O)} defense, ${rkWords(odR)} in EPA allowed at ${odV}.`);
    const [tdV, tdR] = M(T, "def_epa"), [ooV, ooR] = M(O, "off_epa");
    if (tdR != null && ooR != null && ooR - tdR >= 6)
      add((ooR - tdR) / 31 + (tdR <= 8 ? 0.3 : 0), "def", `${cap(poss(T))} defense allows just ${tdV} EPA per play (${rkWords(tdR)}) against ${poss(O)} offense, which ranks ${rkWords(ooR)} at ${ooV}.`);
    // The single biggest pass or rush mismatch.
    let best = null;
    for (const [kind, word] of [["pass", "through the air"], ["rush", "on the ground"]]){
      const a = M(T, `off_${kind}_epa`), b = M(O, `def_${kind}_epa`), c = M(T, `def_${kind}_epa`), d = M(O, `off_${kind}_epa`);
      if (a[1] != null && b[1] != null && a[1] <= 16 && b[1] - a[1] >= 10 && (!best || b[1] - a[1] > best.gap))
        best = {gap: b[1] - a[1], side: "off", text: `The clearest edge is ${word}: ${nick(T)} rank ${rkWords(a[1])} in ${kind} EPA (${a[0]}), and ${nick(O)} are ${rkWords(b[1])} defending it (${b[0]}).`};
      if (c[1] != null && d[1] != null && c[1] <= 16 && d[1] - c[1] >= 10 && (!best || d[1] - c[1] > best.gap))
        best = {gap: d[1] - c[1], side: "def", text: `The clearest edge is ${word}: ${poss(T)} defense ranks ${rkWords(c[1])} against the ${kind} (${c[0]} EPA allowed), while ${poss(O)} ${kind === "pass" ? "passing game" : "run game"} ranks ${rkWords(d[1])} (${d[0]}).`};
    }
    if (best) add(best.gap / 31 + 0.1, best.side === "def" ? "split_def" : "split_off", best.text);
    // Scoring.
    const [pV, pR] = M(T, "off_ppg"), [paV, paR] = M(O, "def_ppg");
    if (pR != null && paR != null && paR - pR >= 8)
      add((paR - pR) / 40, "pts", `${cap(nick(T))} score ${pV} points a game (${rkWords(pR)}); ${nick(O)} give up ${paV} (${rkWords(paR)}).`);
    // ATS form: the most convincing window for T that fits this game.
    const angles = g.trends?.[bet]?.angles || [];
    const good = angles.filter(a => a.n >= 5 && a.pct >= 58 && (a.this_game || /season|Last 10/.test(a.angle)))
      .sort((a, b) => (b.pct - a.pct) || (b.n - a.n))[0];
    if (good) add(0.2 + (good.pct - 50) / 100 + (good.sig ? 0.3 : 0), "ats",
      `${cap(nick(T))} are ${good.record} against the spread ${angleWords(good.angle)}, covering by ${Math.abs(good.avg_margin ?? 0).toFixed(1)} points a game on average.`);
    const oppAngles = g.trends?.[bet === "away" ? "home" : "away"]?.angles || [];
    const bad = oppAngles.filter(a => a.n >= 3 && a.pct != null && a.pct <= 40 && /season|Last 5|Last 10/.test(a.angle))
      .sort((a, b) => a.pct - b.pct)[0];
    if (bad) add(0.2 + (50 - bad.pct) / 120, "oppats",
      `${cap(nick(O))}, meanwhile, are just ${bad.record} ATS ${angleWords(bad.angle)}.`);
    // Injuries: starters out or doubtful on the other side.
    const oh = hurtStarters(O), th = hurtStarters(T);
    if (oh.length > th.length){
      const qb = oh.find(p => p.p === "QB");
      const named = (qb ? [qb] : []).concat(oh.filter(p => p !== qb)).slice(0, 2).map(p => `${p.p} ${p.n}`);
      add((qb ? 0.9 : 0.25) + 0.08 * (oh.length - th.length), "inj",
        `Health is a factor: ${nick(O)} have ${oh.length} starter${oh.length === 1 ? "" : "s"} out or doubtful, including ${named.join(" and ")}${th.length ? `, against ${th.length} for ${nick(T)}` : `, while ${nick(T)} have none`}.`);
    }
    // Power ratings: only when they side with the pick.
    const m = g.model;
    if (m && m.side === T && Math.abs(m.spread_edge ?? 0) >= 0.5)
      add(0.15 + Math.min(Math.abs(m.spread_edge), 6) / 20, "model",
        `The board's power ratings make it ${modelSpread(g, m.model_margin)}, ${Math.abs(m.spread_edge).toFixed(1)} points better for ${nick(T)} than the line.`);
    // Luck: the opponent's record outrunning its points, or T's lagging.
    const lo = W.luck?.[O], lt = W.luck?.[T];
    if (lo && lo.games >= 4 && lo.luck >= 0.8)
      add(0.2 + lo.luck / 10, "luck", `${cap(poss(O))} ${lo.record} record flatters them: by points scored and allowed they play like a ${lo.pythag.toFixed(1)}-win team.`);
    else if (lt && lt.games >= 4 && lt.luck <= -0.8)
      add(0.2 - lt.luck / 10, "luck", `${cap(poss(T))} ${lt.record} record undersells them: by points scored and allowed they play like a ${lt.pythag.toFixed(1)}-win team.`);
    const tr = g[`${bet}_rest`], or = g[`${bet === "away" ? "home" : "away"}_rest`];
    if (tr != null && or != null && tr - or >= 3)
      add(0.15, "rest", `${cap(nick(T))} also have the rest edge, ${tr} days to ${or}.`);
  } else {
    const over = bet === "over", a = g.away, h = g.home;
    const f = s => parseFloat(String(s ?? "").replace(minus, "-"));
    const v = [f(M(a, "off_ppg")[0]), f(M(h, "def_ppg")[0]), f(M(h, "off_ppg")[0]), f(M(a, "def_ppg")[0])];
    if (g.total != null && v.every(x => !isNaN(x))){
      const est = (v[0] + v[1]) / 2 + (v[2] + v[3]) / 2, diff = est - g.total;
      if (over ? diff >= 1 : diff <= -1)
        add(0.3 + Math.min(Math.abs(diff), 8) / 12, "est", `Average each offense's scoring with what the other defense allows and you get ${est.toFixed(1)} points, ${Math.abs(diff).toFixed(1)} ${over ? "above" : "below"} the ${g.total} total.`);
    }
    // Offenses vs defenses by EPA.
    const r = k => [M(a, k)[1], M(h, k)[1]];
    const [ao, ho] = r("off_epa"), [ad, hd] = r("def_epa");
    if ([ao, ho, ad, hd].every(x => x != null)){
      const offAvg = (ao + ho) / 2, defAvg = (ad + hd) / 2;
      if (over && offAvg <= 13) add(0.2 + (16 - offAvg) / 30, "offs", `Both offenses can move it: ${nick(a)} rank ${rkWords(ao)} and ${nick(h)} ${rkWords(ho)} in EPA per play.`);
      if (over && defAvg >= 19) add(0.2 + (defAvg - 16) / 30, "defs", `Neither defense is a wall: ${nick(a)} rank ${rkWords(ad)} and ${nick(h)} ${rkWords(hd)} in EPA allowed.`);
      if (!over && defAvg <= 13) add(0.2 + (16 - defAvg) / 30, "defs", `These are two good defenses: ${nick(a)} rank ${rkWords(ad)} and ${nick(h)} ${rkWords(hd)} in EPA allowed per play.`);
      if (!over && offAvg >= 19) add(0.2 + (offAvg - 16) / 30, "offs", `Neither offense is scaring anyone: ${nick(a)} rank ${rkWords(ao)} and ${nick(h)} ${rkWords(ho)} in EPA per play.`);
    }
    // Pace.
    const [ap, hp] = r("pace_plays");
    if (ap != null && hp != null){
      const avg = (ap + hp) / 2;
      if (over && avg <= 12) add(0.2 + (16 - avg) / 40, "pace", `Pace helps: ${nick(a)} run ${M(a, "pace_plays")[0]} plays a game (${ord(ap)} most) and ${nick(h)} ${M(h, "pace_plays")[0]} (${ord(hp)}), and more snaps means more scoring chances.`);
      if (!over && avg >= 21) add(0.2 + (avg - 16) / 40, "pace", `Neither team plays fast: ${nick(a)} run ${M(a, "pace_plays")[0]} plays a game (${ord(ap)} most) and ${nick(h)} ${M(h, "pace_plays")[0]} (${ord(hp)}), which keeps possessions down.`);
    }
    // Explosive plays.
    const [ae, he] = r("off_explosive");
    if (over && ae != null && he != null && (ae + he) / 2 <= 12)
      add(0.18, "expl", `Both offenses hit big plays: ${M(a, "off_explosive")[0]} of ${poss(a)} snaps (${ord(ae)}) and ${M(h, "off_explosive")[0]} of ${poss(h)} (${ord(he)}) gain 20+ yards through the air or 10+ on the ground.`);
    // O/U form for each team.
    const form = side => (g.trends?.[side]?.angles || []).find(x => x.angle === "Last 5 games" || x.angle === `${D.season} season`);
    const fa = form("away"), fh = form("home");
    const leans = x => { const p = recPct(x?.ou_record); return p == null ? null : over ? p : 1 - p; };
    const ouCount = x => { const [o, u] = String(x.ou_record).split("-").map(Number); return `${over ? o : u} of ${o + u}`; };
    if (fa && fh && leans(fa) >= 0.6 && leans(fh) >= 0.6)
      add(0.25, "ouform", `Both teams have been trending this way: ${poss(a)} games have gone ${over ? "over" : "under"} in ${ouCount(fa)} ${fa.angle === `${D.season} season` ? "this season" : "lately"}, ${poss(h)} in ${ouCount(fh)}.`);
    // Weather.
    const w = g.wx || {};
    if (over && (w.roof === "dome" || (w.src === "forecast" && (w.wind ?? 0) < 10 && (w.precip ?? 0) < 30)))
      add(0.12, "wx", w.roof === "dome" ? "It's indoors, so the weather won't slow anyone down." : `The forecast is friendly, ${Math.round(w.wind)} mph wind and ${Math.round(w.precip ?? 0)}% chance of rain.`);
    if (!over && w.src === "forecast" && ((w.wind ?? 0) >= 15 || (w.precip ?? 0) >= 50))
      add(0.45, "wx", `The weather should help: the kickoff forecast calls for ${Math.round(w.wind)} mph wind${w.gust ? ` (gusts to ${Math.round(w.gust)})` : ""} and a ${Math.round(w.precip ?? 0)}% chance of rain.`);
    // Power ratings.
    const m = g.model;
    if (m && m.lean === (over ? "Over" : "Under") && Math.abs(m.total_edge ?? 0) >= 1)
      add(0.15 + Math.min(Math.abs(m.total_edge), 8) / 25, "model", `The board's power ratings project ${m.model_total.toFixed(1)} points, ${Math.abs(m.total_edge).toFixed(1)} ${over ? "over" : "under"} the market.`);
    // Injuries: hurt defensive starters help the over, a hurt QB helps the under.
    const hurt = (t, side) => hurtStarters(t).filter(p => p.s === side);
    if (over){
      const dh = [...hurt(a, "D"), ...hurt(h, "D")];
      if (dh.length >= 2) add(0.15 + 0.05 * dh.length, "inj", `Injuries favor the offenses: ${dh.length} defensive starters are out or doubtful, including ${dh.slice(0, 2).map(p => `${p.p} ${p.n}`).join(" and ")}.`);
    } else {
      const qbs = [...hurt(a, "O"), ...hurt(h, "O")].filter(p => p.p === "QB");
      if (qbs.length) add(0.6, "inj", `Quarterback health is a problem: ${qbs.map(p => p.n).join(" and ")} ${qbs.length > 1 ? "are" : "is"} out or doubtful.`);
    }
  }
  return R.sort((x, y) => y.score - x.score);
}

// Smaller edges (any rank advantage), used only when the strong list is thin.
const MILD_SPREAD = [["off_epa", "def_epa", "EPA per play"], ["off_success", "def_success", "success rate"],
  ["off_third", "def_third", "third-down rate"], ["off_rz_td", "def_rz_td", "red-zone touchdown rate"],
  ["off_ppg", "def_ppg", "scoring"], ["off_explosive", "def_explosive", "explosive-play rate"]];
function mildReasons(g, bet, taken){
  const R = [];
  if (bet === "away" || bet === "home"){
    const T = g[bet], O = bet === "away" ? g.home : g.away;
    for (const [ok, dk, word] of MILD_SPREAD){
      const [tv, tr] = mv(T, ok), [ov, or] = mv(O, dk);
      if (tr != null && or != null && or > tr && !taken.has(ok))
        R.push({score: (or - tr) / 31, key: "mild", text: `${cap(nick(T))} hold an edge in ${word}: their offense ranks ${ord(tr)} (${tv}) against a defense that ranks ${ord(or)} (${ov}).`});
      const [tdv, tdr] = mv(T, dk), [oov, oor] = mv(O, ok);
      if (tdr != null && oor != null && oor > tdr && !taken.has(dk))
        R.push({score: (oor - tdr) / 31, key: "mild", text: `On defense, ${nick(T)} rank ${ord(tdr)} in ${word} allowed (${tdv}), ${nick(O)} ${ord(oor)} on offense (${oov}).`});
    }
  } else {
    // One combined sentence: every offensive stat where the two teams' average rank leans this way.
    const over = bet === "over", parts = [];
    for (const [k, word] of [["off_epa", "EPA per play"], ["off_ppg", "scoring"], ["off_explosive", "explosive plays"], ["off_rz_td", "red-zone touchdown rate"]]){
      const ra = mv(g.away, k)[1], rh = mv(g.home, k)[1];
      if (ra != null && rh != null && (over ? (ra + rh) / 2 < 16.5 : (ra + rh) / 2 > 16.5)) parts.push(`${word} (${ord(ra)} and ${ord(rh)})`);
    }
    if (parts.length)
      R.push({score: 0.1, key: "mild", text: `Between them, ${nick(g.away)} and ${nick(g.home)} average a ${over ? "top" : "bottom"}-half offensive rank in ${parts.length > 1 ? parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1] : parts[0]}.`});
  }
  return R.sort((x, y) => y.score - x.score);
}

function pickParagraph(g, bet){
  const pick = betLabel(g, bet);
  const strong = pickReasons(g, bet).slice(0, 5);
  const keysUsed = new Set(strong.map(r => r.key === "off" ? "off_epa" : r.key === "def" ? "def_epa" : r.key === "pts" ? "off_ppg" : r.key));
  const reasons = strong.length >= 3 ? strong : strong.concat(mildReasons(g, bet, keysUsed).slice(0, 3 - strong.length));
  const when = `${g.weekday}${g.time && +g.time.split(":")[0] >= 19 ? " night" : ""}`;
  const where = `${g.away} at ${g.home}`;
  let open, frame;
  if (bet === "over" || bet === "under"){
    open = `My pick this week: ${pick} in ${where} on ${when}.`;
    frame = !strong.length ? `The numbers don't scream ${bet}, but the small edges lean that way.`
      : bet === "over" ? "I think this one turns into a shootout, and the numbers back it up." : "I see a grind-it-out game here, and the numbers point the same way.";
  } else {
    const T = g[bet], line = teamLine(g, T);
    open = `My pick this week: ${pick}${line > 0 ? ` ${bet === "away" ? "on the road" : "at home"}` : line < 0 ? ` as ${bet === "away" ? "road" : "home"} underdogs` : ""} on ${when}.`;
    const top = reasons[0]?.key;
    frame = top === "def" || top === "split_def" ? `This game is about ${poss(T)} defense, and I trust it to win the matchup.`
      : top === "off" || top === "split_off" ? `${cap(nick(T))} have the matchup they want on offense, and I don't think ${nick(bet === "away" ? g.home : g.away)} can take it away.`
      : top === "inj" ? `The injury report tells most of the story here.`
      : top === "ats" || top === "oppats" ? `${cap(nick(T))} keep finding ways to beat this kind of number, and the form lines up.`
      : !strong.length ? `On paper this one is close, so I'm backing the side the smaller numbers lean toward.`
      : `${line > 0 ? "The market has the right favorite, but not by enough." : "The market is giving me points on the better-performing team."}`;
  }
  const body = reasons.map((r, i) => r.key === "def" && reasons.slice(0, i).some(x => x.key === "off")
    ? "On the other side, " + r.text.charAt(0).toLowerCase() + r.text.slice(1) : r.text);
  if (strong.length < 3) body.push("It isn't a lopsided matchup on paper, so this is as much about the number as the teams.");
  return [open, frame, ...body, `Give me ${pick}.`].join(" ");
}

function pickPane(g){
  const bets = [["away", `${NAMES[g.away] || g.away} spread`], ["home", `${NAMES[g.home] || g.home} spread`], ["over", "Over"], ["under", "Under"]]
    .filter(([b]) => (b === "over" || b === "under") ? g.total != null : g.spread != null);
  if (!bets.length) return `<div class="card"><p class="meta">No line posted for this game yet.</p></div>`;
  const sel = bets.some(([b]) => b === state.pick?.[g.id]) ? state.pick[g.id] : bets[0][0];
  const text = pickParagraph(g, sel);
  return `<div class="card pick">
    <h4>Make a pick</h4>
    <label class="pick-l" for="pick-${g.id}">Bet</label>
    <select id="pick-${g.id}" class="pick-sel" data-pick="${g.id}">
      ${bets.map(([b, l]) => `<option value="${b}" ${b === sel ? "selected" : ""}>${esc(l)} · ${esc(betLabel(g, b))}</option>`).join("")}
    </select>
    <p class="pick-text" id="pick-text">${esc(text)}</p>
    <div class="pick-actions"><button type="button" class="pick-copy" data-copy="pick-text">Copy</button><span class="soft" id="pick-copied" aria-live="polite"></span></div>
    <p class="meta">Built from the numbers on this page, using only the ones that favor this bet. It's an argument for your pick, not a prediction. Line: ${esc(betLabel(g, sel))}${D.lines_live && g.lineBook ? ` (${esc(g.lineBook)}, ${esc(fmtStamp(D.lines_at))})` : " (nflverse, as of the last scheduled refresh)"}.</p>
  </div>`;
}

/* EPA per play, total first, then the same plays split into passes and runs.
   Each side's total is the play-weighted mix of its two splits. */
const EPA_SPLITS = [["epa", "EPA / play", "all plays"], ["pass_epa", "Pass plays", "incl. sacks, scrambles"], ["rush_epa", "Rush plays", "designed runs"]];
function epaBlock(off, def){
  return `<h5>${off} offense vs ${def} defense</h5>
    <div class="mhead"><span><b>${off}</b> offense</span><span></span><span>defense <b>${def}</b></span></div>
    ${EPA_SPLITS.map(([k, label, sub], i) => `<div class="mrow ${i ? "sub" : ""}">${cellL(mv(off, "off_" + k))}${mid(label, sub)}${cellR(mv(def, "def_" + k))}</div>`).join("")}`;
}
function matchupPane(g){
  return `<div class="card mt">
    <h4>EPA per play</h4>
    <p class="meta tight">Total, then split into pass and rush plays. Ranks: #1 is best on both sides of the ball.</p>
    ${epaBlock(g.away, g.home)}${epaBlock(g.home, g.away)}
    <p class="meta">EPA (expected points added) measures how much each play changed a team's expected points. Offense: higher is better. Defense: lower allowed is better. Within a season, a team's total is the play-weighted mix of its pass and rush numbers, so a pass-heavy team's total leans toward its pass EPA. Every number here blends this season with last, so the total can sit a hair outside the two splits.<br>${[g.away, g.home].map(t => `${t}: ${esc(currentWeek().metrics?.[t]?.note ?? "no data")}`).join("<br>")}</p>
  </div>`;
}

function teamSwitch(g, team){
  return `<div class="sw" role="group" aria-label="Team">
    ${[g.away, g.home].map((t, i) => `<button type="button" data-gteam="${t}" aria-pressed="${t === team}">${t} <span class="soft">${i ? "home" : "away"}</span></button>`).join("")}
  </div>`;
}
function lineTxt(v){ return v == null ? "–" : v === 0 ? "PK" : v > 0 ? `${minus}${v}` : `+${-v}`; }
const GT = {WC: "WC", DIV: "DIV", CON: "CONF", SB: "SB"};

function logsPane(t){
  const log = D.teamx?.[t]?.log || [];
  const seasons = [D.season, D.season - 1];
  return seasons.map(s => {
    const rows = log.filter(r => r.s === s);
    const w = rows.filter(r => r.ats === "W").length, l = rows.filter(r => r.ats === "L").length, p = rows.filter(r => r.ats === "P").length;
    const o = rows.filter(r => r.ou === "OVER").length, u = rows.filter(r => r.ou === "UNDER").length;
    return `<div class="card">
      <div class="card-h"><h4>${s}</h4><span class="num soft">${rows.length ? `ATS ${w}-${l}${p ? "-" + p : ""} · O/U ${o}-${u}` : ""}</span></div>
      ${rows.length ? `<div class="lg lg-h"><span>Wk</span><span>Opp</span><span>Result</span><span class="r">Line</span><span class="ctr">ATS</span><span class="r">Total</span><span class="ctr">O/U</span></div>
      ${rows.map(r => {
        const res = r.pf > r.pa ? "W" : r.pf < r.pa ? "L" : "T";
        const od = r.tot != null && r.tl != null ? r.tot - r.tl : null;
        return `<div class="lg num">
          <span class="soft">${GT[r.gt] || r.wk}</span><span class="opp">${r.home ? "vs" : "@"} ${r.opp}</span><span>${res} ${r.pf}-${r.pa}</span>
          <span class="r">${lineTxt(r.line)}</span>
          <span class="ctr stack"><b class="res ${r.ats === "W" ? "cov" : r.ats === "L" ? "miss" : ""}">${r.ats || "–"}</b><small class="${sgnCls(r.am)}">${r.am == null ? "" : sgn(r.am, 1).replace(".0", "")}</small></span>
          <span class="r">${r.tl ?? "–"}</span>
          <span class="ctr stack"><b class="res ${r.ou === "OVER" ? "over" : r.ou === "UNDER" ? "under" : ""}">${r.ou === "OVER" ? "O" : r.ou === "UNDER" ? "U" : r.ou ? "P" : "–"}</b><small class="${sgnCls(od)}">${od == null ? "" : sgn(od, 1).replace(".0", "")}</small></span>
        </div>`;
      }).join("")}` : `<p class="meta">No completed games yet.</p>`}
    </div>`;
  }).join("") + `<p class="meta">Line is the team's spread (− = favored). The number under ATS is how many points the team beat (+) or missed (−) the spread by; under O/U it's total points minus the closing total. Playoff games are labeled WC, DIV, CONF and SB.</p>`;
}

const TAG_TEXT = {out: "Out", doubtful: "Doubtful", questionable: "Questionable", limited: "Limited practice", gone: "Off roster"};
function tagFor(p){
  if (p.x === "active") return "";
  const label = p.x === "gone" ? "GONE" : p.x === "out" ? (SHORT[p.rs] || "OUT") : p.x === "doubtful" ? "D" : p.x === "questionable" ? "Q" : "LP";
  return `<span class="tag ${p.x}">${label}</span>`;
}
function depthGrid(t, side){
  const av = currentWeek().avail?.[t];
  const players = (av?.depth || []).filter(p => p.s === side);
  if (!players.length) return `<p class="meta">No depth chart loaded.</p>`;
  const rows = new Map();
  for (const p of players){
    const k = p.sl ?? p.p;
    if (!rows.has(k)) rows.set(k, []);
    rows.get(k).push(p);
  }
  const sel = state.depthSel;
  let selP = null, selDepth = null;
  const body = [...rows.values()].map((ps, ri) => {
    ps.sort((a, b) => a.r - b.r);
    const cells = [0, 1, 2, 3].map(i => {
      const p = ps[i];
      if (!p) return `<div class="dc ${i ? "" : "st"}"><span class="soft">–</span></div>`;
      const key = `${t}|${p.p}|${p.n}`;
      if (key === sel){ selP = p; selDepth = ["starter", "2nd", "3rd", "4th"][i]; }
      const inner = p.x === "active"
        ? `<span>${esc(p.n)}</span>`
        : `<button type="button" class="dbtn ${key === sel ? "on" : ""}" data-dsel="${esc(key)}">${esc(p.n)} ${tagFor(p)}</button>`;
      return `<div class="dc ${i ? "" : "st"}">${inner}</div>`;
    }).join("");
    return `<div class="dr ${ri % 2 ? "alt" : ""}"><div class="dp num">${esc(ps[0].p)}</div>${cells}</div>`;
  }).join("");
  const form = players[0].f || "";
  const detail = selP ? (() => {
    const bits = [];
    if (selP.inj) bits.push(esc(selP.inj));
    if (selP.pr) bits.push(esc(selP.pr.replace(" Participation in Practice", " practice").replace(" in Practice", "")));
    if (selP.rs && !SHORT[selP.rs] && selP.rs !== TAG_TEXT[selP.x] && !selP.inj) bits.push(esc(selP.rs));
    if (selP.sh != null) bits.push(`${Math.round(selP.sh * 100)}% of snaps (${esc(selP.sb)})`);
    if (selP.rp) bits.push(`next up ${esc(selP.rp)}${selP.rsh != null ? ` (${Math.round(selP.rsh * 100)}% of snaps)` : ""}`);
    const tagWord = selP.x === "out" ? (selP.rs || "Out") : TAG_TEXT[selP.x];
    return `<div class="dsel ${selP.x}"><div class="dsel-h"><b>${esc(selP.n)} <small class="num">${esc(selP.p)} · ${selDepth}</small></b><span class="tagword">${esc(tagWord)}</span></div>
      <div>${bits.join(" · ") || "No other details on the report."}</div>
      ${selP.og ? `<div class="origin ${selP.og.k}">${esc(originText(selP.og))}</div>` : ""}
      ${selP.fs ? `<div class="soft">${esc(seenText(selP))}</div>` : ""}
      <button type="button" class="linkish" data-dsel="">Close</button></div>`;
  })() : "";
  return `<div class="card flush">
    <div class="card-h pad"><h4>${side === "O" ? "Offense" : "Defense"}</h4><span class="soft strong">${esc(form)}</span></div>
    <div class="dwrap"><div class="dtable">
      <div class="dr dhead"><div class="dp"></div><div class="dc st">Starter</div><div class="dc">2nd</div><div class="dc">3rd</div><div class="dc">4th</div></div>
      ${body}
    </div></div>
    ${detail}
    <p class="meta pad">Swipe the table for 2nd–4th. Tap a tagged player for injury details.</p>
  </div>`;
}
function changesBox(t){
  const c = D.teamx?.[t]?.changes;
  if (!c) return "";
  const pct = v => v == null ? "" : `${Math.round(v * 100)}%`;
  const newTxt = n => n.how === "added" ? `was ${n.from} · ${pct(n.share)} of snaps` : n.how === "promoted" ? `promoted · was ${pct(n.share)}` : "no 2025 NFL snaps";
  const person = (x, label) => !x.now ? "–" : `${esc(x.now)} ${x.changed ? `<b class="chg">new · was ${esc(x.prior)}</b>` : `<span class="soft">(same as ${D.season - 1})</span>`}`;
  const whereCls = w => w.startsWith("now ") || w === "not on a roster" ? "gone" : "";
  return `<div class="card changes">
    <h4>Key changes vs ${D.season - 1}</h4>
    <p>${c.new_starters.length} of ${c.starters} starting spots changed since ${D.season - 1}${c.qb.changed || c.coach.changed ? ", including the " + [c.qb.changed ? "quarterback" : "", c.coach.changed ? "head coach" : ""].filter(Boolean).join(" and ") : ""}. Last season's records were built with a different lineup.</p>
    <div class="kv"><span class="soft">QB</span><span>${person(c.qb)}</span><span class="soft">Coach</span><span>${person(c.coach)}</span></div>
    <h5>New starters</h5>
    ${c.new_starters.length ? c.new_starters.map(n => `<div class="chrow"><span class="num soft">${esc(n.pos)}</span><span class="nm">${esc(n.name)}</span><span class="soft r">${newTxt(n)}</span></div>`).join("") : `<p class="meta">Same starters as last season.</p>`}
    <h5>Gone from ${D.season - 1}'s starting lineup</h5>
    ${c.lost_starters.length ? c.lost_starters.map(n => `<div class="chrow"><span class="num soft">${esc(n.pos)}</span><span class="nm">${esc(n.name)} <small class="num soft">${pct(n.share)}</small></span><span class="r ${whereCls(n.where)}">${esc(n.where)}</span></div>`).join("") : `<p class="meta">Every 50%+ snap player from last season is still starting.</p>`}
    <p class="meta">Starters come from the latest depth chart; "starter last season" means 50%+ of snaps over 6+ games. Name matching between data sources can occasionally miss a player.</p>
  </div>`;
}
function rosterPane(t){
  const av = currentWeek().avail?.[t];
  const note = !av ? "" : av.report_week == null ? "No injury report has been filed yet this season."
    : av.current ? `Week ${av.report_week} injury report.`
    : `The week ${av.week} injury report isn't out yet (teams file Wednesday to Friday), so tags come from week ${av.report_week}.`;
  return `${changesBox(t)}${av ? hurtLastGameBlock(av) : ""}${depthGrid(t, "O")}${depthGrid(t, "D")}
    <p class="meta">${note} ${esc(injSourceText(av))} Tags: Q questionable, D doubtful, OUT, IR injured reserve, PUP / NFI other reserve lists, RES other reserve list, LP limited practice, GONE no longer on this team's roster. Slots are frozen to this team's Week 1 depth chart (${esc(av?.snapshot || "")}) so you can see how far it's been depleted; current status is overlaid on each slot.</p>`;
}
function splitCell(x, right){
  if (!x || !x.n) return `<span class="c ${right ? "r" : "l"} stack2"><span class="num">–</span><small class="soft">no games</small></span>`;
  const m = `<span class="${sgnCls(x.m)}">${sgn(x.m)}</span>`;
  return `<span class="c ${right ? "r" : "l"} stack2">
    <span class="num big">${right ? m + " " + esc(x.rec) : esc(x.rec) + " " + m}</span>
    <small class="num soft">n=${x.n}${x.moe != null ? " · ±" + Math.round(x.moe) : ""}</small>
    ${x.sig ? `<span class="sig">signal</span>` : ""}</span>`;
}
function barsBlock(g, kind){
  const col = side => {
    const t = g[side];
    const rows = (g.trends?.[side]?.recent || []).map(r => ({
      opp: r.opp, d: r.d, v: kind === "ats" ? r.m : (r.tot != null && r.tl != null ? r.tot - r.tl : null),
    }));
    const ordered = rows.slice().reverse();   // most recent at top
    const max = Math.max(1, ...ordered.map(r => Math.abs(r.v ?? 0)));
    return `<div class="bars"><b>${t}</b>${ordered.map(r => `<div class="bar-row"><span class="num soft">${r.opp}</span>
      <span class="bar-track">${r.v == null ? "" : `<i class="${r.v > 0 ? "up" : "down"}" style="width:${(Math.abs(r.v) / max * 50).toFixed(1)}%"></i>`}</span>
      <span class="num r">${r.v == null ? "–" : sgn(r.v, 1).replace(".0", "")}</span></div>`).join("")}</div>`;
  };
  const since = D.chart_since_season ?? 2025;
  return `<div class="card"><h4>${kind === "ats" ? "Cover margin" : "Points vs total"} since ${since}</h4>
    <div class="bars2">${col("away")}${col("home")}</div>
    <p class="meta">Most recent at top. Blue = ${kind === "ats" ? "covered" : "over"}, orange = ${kind === "ats" ? "missed" : "under"}. Includes playoffs.</p></div>`;
}
function splitsPane(g, kind){
  const A = g.splits?.away || [], H = g.splits?.home || [];
  const rows = A.map((a, i) => {
    const h = H[i] || {};
    const sub = a.label === "Head to head" ? `since ${a.sub.split("since ")[1] || ""}`
      : a.label === "All games" ? a.sub : `${g.away} ${a.sub.replace("on the road", "road").replace("at home", "home")} · ${g.home} ${(h.sub || "").replace("on the road", "road").replace("at home", "home")}`;
    return mrow(splitCell(a[kind]), mid(a.label, sub), splitCell(h[kind], true));
  }).join("");
  return `<div class="card">
    <h4>${kind === "ats" ? "ATS splits" : "O/U splits"}</h4>
    <p class="meta tight">${kind === "ats" ? "Record (W-L) and average margin vs the spread" : "Record (overs-unders) and average points vs the total"}, ${D.season - 2}–${String(D.season).slice(2)} unless noted</p>
    <div class="mhead"><span><b>${g.away}</b></span><span></span><span><b>${g.home}</b></span></div>
    ${rows}
    <p class="meta">n = games, ± = 95% margin of error. "signal" appears only with 10+ games and a record farther from 50% than the margin of error.</p>
  </div>${barsBlock(g, kind)}`;
}

function renderGame(g, tab){
  if (!GTABS.some(([k]) => k === tab)) tab = "logs";
  if (!state.gameTeam || ![g.away, g.home].includes(state.gameTeam)) state.gameTeam = g.away;
  const team = state.gameTeam;
  const when = `${fmtDate(g.date, g.weekday)} · ${fmtKick(g.time)} ET`;
  const pane = tab === "logs" ? teamSwitch(g, team) + logsPane(team)
    : tab === "matchup" ? matchupPane(g)
    : tab === "pick" ? pickPane(g)
    : tab === "roster" ? teamSwitch(g, team) + rosterPane(team)
    : splitsPane(g, tab);
  app.innerHTML = `<div class="gpage">
    <div class="ghero">
      <div class="ghero-top"><a href="#" class="back">‹ Week ${currentWeek().week}</a><span>${esc(when)}</span></div>
      <div class="ghero-main">
        <div><h2>${teamsLine(g)}</h2><p>${TEAM_FULL(g.away)} at ${TEAM_FULL(g.home)}${g.stadium ? " · " + esc(g.stadium) : ""}</p></div>
        <div class="chips2"><div class="chipbox hot"><small>SPREAD</small><b class="num">${esc(spreadText(g))}</b></div><div class="chipbox"><small>O/U</small><b class="num">${g.total ?? "–"}</b></div></div>
      </div>
      ${finalStrip(g)}
      ${weatherStrip(g, true)}
    </div>
    <nav class="gtabs" role="tablist">${GTABS.map(([k, l]) => `<a role="tab" href="#game=${g.id}&tab=${k}" aria-selected="${k === tab}">${l}</a>`).join("")}</nav>
    <div class="gbody">${pane}</div>
  </div>`;
}

function teamAvailability(t){
  const W = D.weeks.find(w => w.week === D.current_week) || D.weeks[0];
  const av = W.avail?.[t];
  if (!av) return `<p class="meta">${t} isn't playing in week ${D.current_week}, so its latest depth chart isn't included.</p>`;
  const saved = state.week; state.week = W.week;
  const html = availabilityPanel(t).replace(/^<div class="block"><h4>.*?<\/h4>/, '<div class="block">');
  state.week = saved;
  return html;
}

function renderTeams(){
  const t = state.team, T = D.teams[t], M = D.latest_metrics[t];
  const metricRows = (defs) => defs.map(([k, label, hb]) => {
    const [v, r] = M?.v?.[k] || [null, null];
    const pos = r == null ? null : ((r - 1) / 31) * 100;
    // Pass and rush EPA sit indented under the total EPA row they split.
    const sub = /_(pass|rush)_epa$/.test(k);
    return `<tr class="${sub ? "t-sub" : ""}"><td>${sub ? (k.includes("pass") ? "Pass plays" : "Rush plays") : esc(label)}</td><td class="r num">${esc(v ?? "–")}</td><td class="r">${rk(r)}</td>
      <td style="width:28%"><div class="bar" title="#1 on the left, #32 on the right">${pos == null ? "" : `<i style="left:${pos}%"></i>`}</div></td></tr>`;
  }).join("");
  const tile = (k, r, extra) => `<div class="tile"><div class="k">${k}</div><div class="v">${r?.n ? esc(r.record) : "–"}</div><div class="s">${r?.n ? `${extra ?? r.pct + "%"} · n=${r.n} · ±${r.moe}` : "no games"}${r?.sig ? ' <span class="sig">signal</span>' : ""}</div></div>`;

  app.innerHTML = `
    <div class="picker" role="group" aria-label="Team">
      ${Object.keys(D.teams).sort().map(x => `<button type="button" id="tm-${x}" data-team="${x}" aria-pressed="${x === t}" title="${NAMES[x] || x}">${x}</button>`).join("")}
    </div>
    <div class="t-head"><h2>${t} ${NAMES[t] || ""}</h2><p>${esc(M?.note ?? "")}</p></div>
    <div class="tiles">
      ${tile("ATS overall", T.ats)}${tile("ATS at home", T.ats_home)}${tile("ATS on the road", T.ats_away)}${tile("Over / under", T.ou, T.ou.n ? T.ou.pct + "% over" : "")}
    </div>
    <p class="meta" style="margin:-12px 0 0">ATS: ${D.n_seasons} seasons through ${D.through}, regular season.</p>
    <div class="pair section">
      <div class="block"><h3 class="sec-h">Offense</h3><div class="tbl-wrap"><table><thead><tr><th>Stat</th><th class="r">Value</th><th class="r">Rank</th><th>League position</th></tr></thead><tbody>${metricRows(OFF)}</tbody></table></div></div>
      <div class="block"><h3 class="sec-h">Defense</h3><div class="tbl-wrap"><table><thead><tr><th>Stat</th><th class="r">Value</th><th class="r">Rank</th><th>League position</th></tr></thead><tbody>${metricRows(DEF)}</tbody></table></div></div>
    </div>
    <section class="section"><h3 class="sec-h">Luck check</h3>
      ${luckBlock(T.luck_now, D.season + " so far")}${luckBlock(T.luck_prior, String(D.season - 1))}
    </section>
    <section class="section"><h3 class="sec-h">Depth chart and injuries</h3>${teamAvailability(t)}</section>
    <section class="section"><h3 class="sec-h">Trends</h3>
      <div class="pair"><div>${anglesTable(T.angles, "ats")}</div><div>${anglesTable(T.angles, "ou")}</div></div>
      <h3 class="sec-h" style="margin-top:14px">Last ${T.recent.length} games vs the spread</h3>${recentChart(T.recent, t)}
    </section>
    <section class="section"><h3 class="sec-h">Against the spread, by situation</h3>${splitsTable(t)}
      <p class="meta">Read n first. A ${T.splits[1]?.r ?? ""} record over ${T.splits[1]?.n ?? 0} games carries a ±${T.splits[1]?.m ?? "–"} point margin of error.</p>
    </section>
    <p class="foot">Metrics blend 2025 and 2026 and include every game played so far. Rank #1 is the best in the league.</p>
  `;
}

function render(){
  if (parseRoute().game && state.view !== "week"){ state.view = "week"; }
  document.getElementById("tab-week").setAttribute("aria-pressed", state.view === "week");
  document.getElementById("tab-teams").setAttribute("aria-pressed", state.view === "teams");
  (state.view === "teams" ? renderTeams : renderWeek)();
}

document.getElementById("stamp").textContent =
  `${D.season} · results through ${new Date(D.results_through + "T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})} · updated ${new Date(D.generated).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}`;

/* ----------------------------------------------------------------------
   Live lines: the refresh button asks the Cloudflare Worker (worker/odds.js)
   for current sportsbook spreads and totals, and swaps them in for every
   upcoming game. It shows D.odds_book's line (config.ODDS_BOOK); a game that
   book hasn't posted falls back to the line the most books are dealing
   (ties go to the line nearest the median). The model gap is recomputed
   against the new line exactly as queries.model_lines does it:
   gap = model - market, + = home / over.
   Nothing else is recomputed -- stats, trends and injuries stay as of the
   last scheduled refresh.
   ---------------------------------------------------------------------- */
function consensus(vals){
  const v = vals.filter(x => typeof x === "number").sort((a, b) => a - b);
  if (!v.length) return null;
  const med = v[Math.floor((v.length - 1) / 2)] / 2 + v[Math.ceil((v.length - 1) / 2)] / 2;
  const count = new Map(); v.forEach(x => count.set(x, (count.get(x) || 0) + 1));
  return [...count].sort((a, b) => (b[1] - a[1]) || (Math.abs(a[0] - med) - Math.abs(b[0] - med)))[0][0];
}
const kickoffMs = g => new Date(`${g.date}T${g.time || "13:00"}:00-04:00`).getTime();   // ET; an hour off in Nov-Jan is fine for matching
function matchEvent(g, events){
  const n = t => (NAMES[t] || t).toLowerCase();
  return events.find(e => e.home.toLowerCase().endsWith(n(g.home)) && e.away.toLowerCase().endsWith(n(g.away))
    && Math.abs(new Date(e.commence) - kickoffMs(g)) < 36 * 3600e3);
}
function applyLines(data){
  let n = 0;
  for (const W of D.weeks) for (const g of W.games){
    if (g.final) continue;
    const e = matchEvent(g, data.events || []);
    if (!e) continue;
    const pref = e.books.find(b => b.book === D.odds_book);
    const homePt = pref?.home_pt ?? consensus(e.books.map(b => b.home_pt));
    const total = pref?.total ?? consensus(e.books.map(b => b.total));
    g.lineBook = pref?.home_pt != null ? D.odds_book : "most books";
    if (homePt != null) g.spread = homePt === 0 ? 0 : -homePt;      // Odds API: home team's own number; board: + = home favored
    if (total != null) g.total = total;
    g.books = e.books.filter(b => b.home_pt != null || b.total != null).length;
    const m = g.model;
    if (m){
      if (homePt != null){
        m.market_margin = g.spread; m.spread_edge = Math.round((m.model_margin - g.spread) * 10) / 10;
        m.side = Math.abs(m.model_margin - g.spread) < 0.05 ? null : (m.model_margin > g.spread ? g.home : g.away);
      }
      if (total != null){
        m.market_total = g.total; m.total_edge = Math.round((m.model_total - g.total) * 10) / 10;
        m.lean = Math.abs(m.model_total - g.total) < 0.05 ? null : (m.model_total > g.total ? "Over" : "Under");
      }
    }
    n++;
  }
  D.lines_at = data.fetched_at; D.lines_live = true;
  return n;
}
function linesStampText(data, n){
  const fallback = D.weeks.flatMap(w => w.games).filter(g => g.lineBook === "most books").length;
  return `${D.odds_book || "live"} lines, ${fmtStamp(data.fetched_at)}${fallback ? ` (${fallback} game${fallback > 1 ? "s" : ""} from most books)` : ""}${n ? "" : " (no games matched)"}${data.note ? " · " + data.note : ""}`;
}
async function refreshLines(){
  const btn = document.getElementById("refresh"), out = document.getElementById("lines-stamp");
  btn.classList.add("busy"); btn.disabled = true;
  try {
    const r = await fetch(D.odds_url.replace(/\/$/, "") + "/odds", {cache: "no-store"});
    const data = await r.json();
    if (!r.ok || !data.events) throw new Error(data.error || `status ${r.status}`);
    const n = applyLines(data);
    out.textContent = linesStampText(data, n);
    store.set("lines", data);
    const y = window.scrollY; render(); window.scrollTo(0, y);
  } catch (err){
    out.textContent = `Couldn't refresh lines (${err.message}).`;
  } finally {
    btn.classList.remove("busy"); btn.disabled = false;
  }
}
if (D.odds_url){
  const btn = document.getElementById("refresh");
  btn.hidden = false;
  btn.addEventListener("click", refreshLines);
  // Reuse this viewer's last pull if it's newer than the build and under 12 hours old.
  const saved = store.get("lines", null);
  if (saved?.fetched_at && new Date(saved.fetched_at) > new Date(D.generated) && Date.now() - new Date(saved.fetched_at) < 12 * 3600e3){
    const n = applyLines(saved);
    document.getElementById("lines-stamp").textContent = linesStampText(saved, n);
  }
}

document.querySelector(".top .seg").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]"); if (!b) return;
  state.view = b.dataset.view; store.set("view", state.view);
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  render(); window.scrollTo(0, 0);
});
app.addEventListener("change", e => {
  const ps = e.target.closest("select[data-pick]");
  if (ps){ state.pick[ps.dataset.pick] = ps.value; const y = window.scrollY; render(); window.scrollTo(0, y); document.getElementById(ps.id)?.focus(); }
});
app.addEventListener("click", e => {
  const cp = e.target.closest("button[data-copy]");
  if (cp){
    const el = document.getElementById(cp.dataset.copy), text = el?.textContent || "";
    const done = ok => { const m = document.getElementById("pick-copied"); if (m) m.textContent = ok ? "Copied" : "Selected: press copy on your keyboard or phone"; };
    // Fallback when the Clipboard API is missing or blocked: select the paragraph
    // and try the older copy command, so at worst the text is already highlighted.
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(el); getSelection().removeAllRanges(); getSelection().addRange(r);
      let ok = false; try { ok = document.execCommand("copy"); } catch {}
      done(ok);
    };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
    else fallback();
    return;
  }
  const tv = e.target.closest("button[data-tile]");
  if (tv){
    state.tileView[tv.dataset.tile] = tv.dataset.v;
    const el = document.getElementById("g-" + tv.dataset.tile);
    if (el) el.outerHTML = gameTile(findGame(tv.dataset.tile));
    return;
  }
  const ex = e.target.closest("button[data-expand]");
  if (ex){
    const id = ex.dataset.expand;
    if (state.tileExpanded.has(id)) state.tileExpanded.delete(id); else state.tileExpanded.add(id);
    const el = document.getElementById("g-" + id);
    if (el) el.outerHTML = gameTile(findGame(id));
    return;
  }
  const gt = e.target.closest("button[data-gteam]");
  if (gt){ state.gameTeam = gt.dataset.gteam; state.depthSel = null; render(); return; }
  const ds = e.target.closest("button[data-dsel]");
  if (ds){ state.depthSel = ds.dataset.dsel && ds.dataset.dsel !== state.depthSel ? ds.dataset.dsel : null; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const back = e.target.closest("a.back");
  if (back){
    e.preventDefault();
    const id = parseRoute().game;
    history.pushState(null, "", location.pathname + location.search);
    render();
    const el = id && document.getElementById("g-" + id);
    if (el) el.scrollIntoView({block: "start"}); else window.scrollTo(0, 0);
    return;
  }
  const w = e.target.closest("button[data-week]");
  if (w){ state.week = Number(w.dataset.week); store.set("week", state.week); render(); return; }
  const t = e.target.closest("button[data-team]");
  if (t){ state.team = t.dataset.team; store.set("team", state.team); render(); return; }
  const tb = e.target.closest("button[data-tab]");
  if (tb){
    state.tabs[tb.dataset.game] = tb.dataset.tab;
    const body = app.querySelector(`[data-body="${tb.dataset.game}"]`);
    if (body){ body.innerHTML = gameBody(findGame(tb.dataset.game)); document.getElementById(`tab-${tb.dataset.game}-${tb.dataset.tab}`)?.focus(); }
    return;
  }
  const j = e.target.closest("button[data-jump]");
  if (j){
    const el = document.getElementById("g-" + j.dataset.jump);
    if (j.dataset.openTab){ state.tabs[j.dataset.jump] = j.dataset.openTab; const b = el?.querySelector(".body"); if (b && el.open) b.innerHTML = gameBody(findGame(j.dataset.jump)); }
    if (el){ el.open = true; el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"}); }
  }
});
app.addEventListener("toggle", e => {
  const d = e.target;
  if (d.matches && d.matches("details.game")){
    if (d.open){
      state.open.add(d.dataset.id);
      const b = d.querySelector(".body");
      if (b && !b.innerHTML.trim()) b.innerHTML = gameBody(findGame(d.dataset.id));
    } else state.open.delete(d.dataset.id);
  }
  if (d.id === "model-table") state.modelOpen = d.open;
}, true);

function showTip(e){
  const r = e.target.closest && e.target.closest("rect.hit");
  if (!r){ tip.hidden = true; return; }
  tip.innerHTML = r.dataset.tip;
  tip.hidden = false;
  const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  const y = Math.max(8, e.clientY - tip.offsetHeight - 12);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
app.addEventListener("pointermove", showTip);
app.addEventListener("pointerdown", showTip);
app.addEventListener("pointerleave", () => { tip.hidden = true; });
window.addEventListener("scroll", () => { tip.hidden = true; }, {passive: true});

let lastGame = parseRoute().game;
window.addEventListener("hashchange", () => {
  const r = parseRoute();
  if (r.game !== lastGame){ state.depthSel = null; state.gameTeam = null; }
  const wasGame = lastGame;
  lastGame = r.game;
  render();
  if (r.game && r.game !== wasGame) window.scrollTo(0, 0);
  else if (!r.game && wasGame){ const el = document.getElementById("g-" + wasGame); if (el) el.scrollIntoView({block: "start"}); }
});

render();
})();
</script>
